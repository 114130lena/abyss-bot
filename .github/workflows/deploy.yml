name: Deploy CHZZK Bot

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: chzzk-bot-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate bot Python files
        run: |
          python -m py_compile main.py chzzk_replay_notifier.py cafe_notifier.py twitter_notifier.py twitter_huya_notifier.py youtube_notifier.py youtube_websub.py health_monitor.py delivery_review.py delivery_latency.py banner_manager.py creator_profiles.py creator_groups.py discord_v2.py notice_intelligence.py resilience.py test_alert.py test_image_card.py test_bot.py x_post_media.py x_repost_notifier.py x_repost_delivery_ledger.py x_spaces_notifier.py x_feed_health.py x_fx_feed.py fanart_discovery.py fanart_url_media.py random_media.py guild_server_banner.py schedule_display.py fanart_public_stats.py guild_banner_timer_runner.py guild_banner_healthcheck.py clip_healthcheck.py fanart_fx_rss.py fanart_fx_search.py fanart_global_sources.py fanart_free_search.py fanart_artist_watch.py fanart_candidate_cache.py fanart_review.py fanart_library.py fanart_refresh.py fanart_usage.py fanart_relevance.py fanart_vision.py chzzk_clip_digest.py discord_message_sync.py fanart_weekly_cleanup.py

      - name: Install Korean font for profile image headers
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-nanum

      - name: Install test dependencies and run regression tests
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -p 'test_x_*.py' -v
          python -m unittest discover -s tests -p 'test_restore_local_fanart.py' -v
          python -m unittest discover -s tests -p 'test_banner_cache_repair.py' -v
          python -m unittest discover -s tests -p 'test_fanart_fx_search.py' -v
          python -m unittest discover -s tests -p 'test_fanart_global_sources.py' -v
          python -m unittest discover -s tests -p 'test_fanart_free_search.py' -v
          python -m unittest discover -s tests -p 'test_free_fanart_refresh.py' -v
          python -m unittest discover -s tests -p 'test_fanart_artist_watch.py' -v
          python -m unittest discover -s tests -p 'test_fanart_rss_health.py' -v
          python -m unittest discover -s tests -p 'test_health_monitor.py' -v
          python -m unittest discover -s tests -p 'test_x_spaces_worker.py' -v
          python -m unittest discover -s tests -p 'test_bootstrap_and_maintenance.py' -v
          python -m unittest discover -s tests -p 'test_deploy_workflow_paths.py' -v
          python -m unittest discover -s tests -p 'test_fanart_vision.py' -v
          python -m unittest -v test_guild_server_banner.py
          python -m unittest discover -s tests -p 'test_banner_info_sync.py' -v
          python -m unittest discover -s tests -p 'test_banner_metadata_recovery.py' -v
          python -m unittest discover -s tests -p 'test_banner_secret_config.py' -v
          python -m unittest discover -s tests -p 'test_banner_min_candidates.py' -v
          python -m unittest discover -s tests -p 'test_huya_guild_banner.py' -v
          python -m unittest discover -s tests -p 'test_scheduled_publishing.py' -v
          python -m unittest discover -s tests -p 'test_banner_persistent_retry.py' -v
          python -m unittest discover -s tests -p 'test_schedule_display.py' -v
          python -m unittest discover -s tests -p 'test_public_card_statistics.py' -v
          python -m unittest discover -s tests -p 'test_nonrepeating_media_and_banner_ui.py' -v
          python -m unittest discover -s tests -p 'test_clip_digest.py' -v
          python -m unittest discover -s tests -p 'test_original_message_edit.py' -v
          python -m unittest -v test_bot.py

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          SSH_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          set -eu
          test -n "$SSH_KEY"
          test -n "$SSH_HOST"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Upload bot source to temporary directory
        env:
          SSH_HOST: ${{ secrets.ORACLE_HOST }}
          SSH_USER: ${{ secrets.ORACLE_USER }}
        run: |
          set -eu
          ssh -i ~/.ssh/oracle_key -o IdentitiesOnly=yes "$SSH_USER@$SSH_HOST" \
            'mkdir -p /home/ubuntu/chzzk-bot/.deploy-staging'
          scp -i ~/.ssh/oracle_key -o IdentitiesOnly=yes \
            main.py chzzk_replay_notifier.py cafe_notifier.py twitter_notifier.py twitter_huya_notifier.py youtube_notifier.py youtube_websub.py health_monitor.py delivery_review.py delivery_latency.py banner_manager.py creator_profiles.py creator_groups.py discord_v2.py notice_intelligence.py resilience.py test_alert.py test_image_card.py x_post_media.py x_repost_notifier.py x_repost_delivery_ledger.py x_spaces_notifier.py x_feed_health.py x_fx_feed.py fanart_discovery.py fanart_url_media.py random_media.py guild_server_banner.py schedule_display.py fanart_public_stats.py guild_banner_timer_runner.py guild_banner_healthcheck.py clip_healthcheck.py fanart_fx_rss.py fanart_fx_search.py fanart_global_sources.py fanart_free_search.py fanart_artist_watch.py fanart_weekly_cleanup.py fanart_review.py fanart_library.py fanart_candidate_cache.py fanart_refresh.py fanart_usage.py fanart_relevance.py fanart_vision.py chzzk_clip_digest.py discord_message_sync.py requirements.txt youtube_channels.txt \
            "$SSH_USER@$SSH_HOST:/home/ubuntu/chzzk-bot/.deploy-staging/"

      - name: Configure banner credentials from GitHub Secrets
        env:
          SSH_HOST: ${{ secrets.ORACLE_HOST }}
          SSH_USER: ${{ secrets.ORACLE_USER }}
          BANNER_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          BANNER_GUILD: ${{ secrets.DISCORD_GUILD_ID }}
        run: |
          set -euo pipefail
          # Missing GitHub Secrets fail explicitly. Never use echo or shell tracing
          # to print credentials, and do not accidentally enable an unauthenticated bot.
          if [ -z "$BANNER_TOKEN" ] || [ -z "$BANNER_GUILD" ]; then
            echo "::error::Set DISCORD_BOT_TOKEN and DISCORD_GUILD_ID in repository Actions Secrets."
            exit 1
          fi
          scp -i ~/.ssh/oracle_key -o IdentitiesOnly=yes \
            scripts/configure_banner_env.py \
            "$SSH_USER@$SSH_HOST:/home/ubuntu/chzzk-bot/.deploy-staging/configure_banner_env.py"
          python3 -c '
          import json, os, sys
          json.dump({
              "DISCORD_BOT_TOKEN": os.environ["BANNER_TOKEN"],
              "DISCORD_GUILD_ID": os.environ["BANNER_GUILD"],
              "SERVER_BANNER_ENABLED": "1",
              "SERVER_BANNER_USE_COLLECTED": "1",
              "SERVER_BANNER_ALLOW_FIT": "1",
              "FANART_CACHE_CANDIDATES": "1",
              "FANART_DISCOVERY_ENABLED": "1",
              "SERVER_BANNER_INFO_CHANNEL_ID": "1567561255764500551",
              "SERVER_BANNER_INFO_MESSAGE_ID": "1567562116280360960",
              "SERVER_BANNER_INFO_POLL_SECONDS": "60",
              "SERVER_BANNER_AUDIT_LOOKUP": "1",
              "SERVER_BANNER_SOURCE_IMAGE_MATCH": "1",
              "CHZZK_CLIP_CHANNEL_ID": "1567760518977167501",
              "CHZZK_CLIP_MESSAGE_ID": "1567763296151539875",
          }, sys.stdout)
          ' | ssh -i ~/.ssh/oracle_key -o IdentitiesOnly=yes \
              "$SSH_USER@$SSH_HOST" \
              'python3 /home/ubuntu/chzzk-bot/.deploy-staging/configure_banner_env.py'

      - name: Validate and deploy, then restart
        env:
          SSH_HOST: ${{ secrets.ORACLE_HOST }}
          SSH_USER: ${{ secrets.ORACLE_USER }}
        run: |
          ssh -i ~/.ssh/oracle_key -o IdentitiesOnly=yes "$SSH_USER@$SSH_HOST" "DEPLOY_SHA='$GITHUB_SHA' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          diagnose_deploy_failure() {
            rc=${1:-$?}
            echo "::error::Remote deployment failed at line ${BASH_LINENO[0]:-unknown} (exit $rc)"
            echo "Service state (metadata only; no environment or webhook values):"
            sudo systemctl show chzzk-bot --no-pager \
              --property=LoadState,ActiveState,SubState,Result,ExecMainCode,ExecMainStatus,Restart,MainPID || true
            exit "$rc"
          }
          trap diagnose_deploy_failure ERR
          cd /home/ubuntu/chzzk-bot
          echo "::group::Validate staged Python and dependencies"
          # Prefer the production environment, but support servers using the
          # separately-created test venv rather than failing with ENOENT.
          if [ -x .venv/bin/python ]; then
            BOT_PY=.venv/bin/python
          elif [ -x .venv-test/bin/python ]; then
            BOT_PY=.venv-test/bin/python
          else
            echo "::error::No Python virtualenv found (.venv or .venv-test)."
            exit 1
          fi
          echo "Using Python: $BOT_PY"
          "$BOT_PY" -m py_compile .deploy-staging/main.py .deploy-staging/chzzk_replay_notifier.py .deploy-staging/cafe_notifier.py .deploy-staging/twitter_notifier.py .deploy-staging/twitter_huya_notifier.py .deploy-staging/youtube_notifier.py .deploy-staging/youtube_websub.py .deploy-staging/health_monitor.py .deploy-staging/delivery_review.py .deploy-staging/delivery_latency.py .deploy-staging/banner_manager.py .deploy-staging/creator_profiles.py .deploy-staging/creator_groups.py .deploy-staging/discord_v2.py .deploy-staging/notice_intelligence.py .deploy-staging/resilience.py .deploy-staging/test_alert.py .deploy-staging/test_image_card.py .deploy-staging/x_post_media.py .deploy-staging/x_repost_notifier.py .deploy-staging/x_repost_delivery_ledger.py .deploy-staging/x_spaces_notifier.py .deploy-staging/x_feed_health.py .deploy-staging/x_fx_feed.py .deploy-staging/fanart_discovery.py .deploy-staging/fanart_url_media.py .deploy-staging/random_media.py .deploy-staging/guild_server_banner.py .deploy-staging/schedule_display.py .deploy-staging/fanart_public_stats.py .deploy-staging/guild_banner_timer_runner.py .deploy-staging/guild_banner_healthcheck.py .deploy-staging/clip_healthcheck.py .deploy-staging/fanart_fx_rss.py .deploy-staging/fanart_fx_search.py .deploy-staging/fanart_global_sources.py .deploy-staging/fanart_free_search.py .deploy-staging/fanart_artist_watch.py .deploy-staging/fanart_weekly_cleanup.py .deploy-staging/fanart_review.py .deploy-staging/fanart_library.py .deploy-staging/fanart_candidate_cache.py .deploy-staging/fanart_refresh.py .deploy-staging/fanart_usage.py .deploy-staging/fanart_relevance.py .deploy-staging/fanart_vision.py .deploy-staging/chzzk_clip_digest.py .deploy-staging/discord_message_sync.py
          "$BOT_PY" -m pip install -r .deploy-staging/requirements.txt

          echo "::endgroup::"
          echo "::group::Backup and activate bot version"
          backup_dir=$(mktemp -d /tmp/chzzk-bot-backup.XXXXXX)
          cp main.py cafe_notifier.py twitter_notifier.py requirements.txt "$backup_dir/"
          if [ -f twitter_huya_notifier.py ]; then cp twitter_huya_notifier.py "$backup_dir/"; fi
          if [ -f chzzk_replay_notifier.py ]; then cp chzzk_replay_notifier.py "$backup_dir/"; fi
          if [ -f youtube_notifier.py ]; then cp youtube_notifier.py "$backup_dir/"; fi
          if [ -f youtube_channels.txt ]; then cp youtube_channels.txt "$backup_dir/"; fi
          if [ -f resilience.py ]; then cp resilience.py "$backup_dir/"; fi
          if [ -f youtube_websub.py ]; then cp youtube_websub.py "$backup_dir/"; fi
          if [ -f health_monitor.py ]; then cp health_monitor.py "$backup_dir/"; fi
          if [ -f delivery_review.py ]; then cp delivery_review.py "$backup_dir/"; fi
          if [ -f delivery_latency.py ]; then cp delivery_latency.py "$backup_dir/"; fi
          if [ -f banner_manager.py ]; then cp banner_manager.py "$backup_dir/"; fi
          if [ -f creator_groups.py ]; then cp creator_groups.py "$backup_dir/"; fi
          if [ -f creator_profiles.py ]; then cp creator_profiles.py "$backup_dir/"; fi
          if [ -f discord_v2.py ]; then cp discord_v2.py "$backup_dir/"; fi
          if [ -f notice_intelligence.py ]; then cp notice_intelligence.py "$backup_dir/"; fi
          if [ -f test_alert.py ]; then cp test_alert.py "$backup_dir/"; fi
          if [ -f test_image_card.py ]; then cp test_image_card.py "$backup_dir/"; fi
          # Backup every optional runtime module; preserve absence for rollback.
          for module in x_post_media.py x_repost_notifier.py x_repost_delivery_ledger.py x_spaces_notifier.py x_feed_health.py x_fx_feed.py fanart_discovery.py fanart_url_media.py random_media.py guild_server_banner.py schedule_display.py fanart_public_stats.py guild_banner_timer_runner.py guild_banner_healthcheck.py clip_healthcheck.py fanart_fx_rss.py fanart_fx_search.py fanart_global_sources.py fanart_free_search.py fanart_artist_watch.py fanart_weekly_cleanup.py fanart_review.py fanart_library.py fanart_candidate_cache.py fanart_refresh.py fanart_usage.py fanart_relevance.py fanart_vision.py chzzk_clip_digest.py discord_message_sync.py; do
            if [ -f "$module" ]; then cp "$module" "$backup_dir/"; fi
          done
          restore() {
            cp "$backup_dir/main.py" "$backup_dir/cafe_notifier.py" "$backup_dir/twitter_notifier.py" "$backup_dir/requirements.txt" .
            if [ -f "$backup_dir/twitter_huya_notifier.py" ]; then cp "$backup_dir/twitter_huya_notifier.py" .; else rm -f twitter_huya_notifier.py; fi
            if [ -f "$backup_dir/chzzk_replay_notifier.py" ]; then cp "$backup_dir/chzzk_replay_notifier.py" .; else rm -f chzzk_replay_notifier.py; fi
            if [ -f "$backup_dir/youtube_notifier.py" ]; then cp "$backup_dir/youtube_notifier.py" .; else rm -f youtube_notifier.py; fi
            if [ -f "$backup_dir/youtube_channels.txt" ]; then cp "$backup_dir/youtube_channels.txt" .; else rm -f youtube_channels.txt; fi
            if [ -f "$backup_dir/resilience.py" ]; then cp "$backup_dir/resilience.py" .; else rm -f resilience.py; fi
            if [ -f "$backup_dir/youtube_websub.py" ]; then cp "$backup_dir/youtube_websub.py" .; else rm -f youtube_websub.py; fi
            if [ -f "$backup_dir/health_monitor.py" ]; then cp "$backup_dir/health_monitor.py" .; else rm -f health_monitor.py; fi
            if [ -f "$backup_dir/delivery_review.py" ]; then cp "$backup_dir/delivery_review.py" .; else rm -f delivery_review.py; fi
            if [ -f "$backup_dir/delivery_latency.py" ]; then cp "$backup_dir/delivery_latency.py" .; else rm -f delivery_latency.py; fi
            if [ -f "$backup_dir/banner_manager.py" ]; then cp "$backup_dir/banner_manager.py" .; else rm -f banner_manager.py; fi
            if [ -f "$backup_dir/creator_groups.py" ]; then cp "$backup_dir/creator_groups.py" .; else rm -f creator_groups.py; fi
            if [ -f "$backup_dir/creator_profiles.py" ]; then cp "$backup_dir/creator_profiles.py" .; else rm -f creator_profiles.py; fi
            if [ -f "$backup_dir/discord_v2.py" ]; then cp "$backup_dir/discord_v2.py" .; else rm -f discord_v2.py; fi
            if [ -f "$backup_dir/notice_intelligence.py" ]; then cp "$backup_dir/notice_intelligence.py" .; else rm -f notice_intelligence.py; fi
            if [ -f "$backup_dir/test_alert.py" ]; then cp "$backup_dir/test_alert.py" .; else rm -f test_alert.py; fi
            if [ -f "$backup_dir/test_image_card.py" ]; then cp "$backup_dir/test_image_card.py" .; else rm -f test_image_card.py; fi
            for module in x_post_media.py x_repost_notifier.py x_repost_delivery_ledger.py x_spaces_notifier.py x_feed_health.py x_fx_feed.py fanart_discovery.py fanart_url_media.py random_media.py guild_server_banner.py schedule_display.py fanart_public_stats.py guild_banner_timer_runner.py guild_banner_healthcheck.py clip_healthcheck.py fanart_fx_rss.py fanart_fx_search.py fanart_global_sources.py fanart_free_search.py fanart_artist_watch.py fanart_weekly_cleanup.py fanart_review.py fanart_library.py fanart_candidate_cache.py fanart_refresh.py fanart_usage.py fanart_relevance.py fanart_vision.py chzzk_clip_digest.py discord_message_sync.py; do
              if [ -f "$backup_dir/$module" ]; then cp "$backup_dir/$module" .; else rm -f "$module"; fi
            done
            sudo systemctl restart chzzk-bot
          }
          rollback_on_error() {
            rc=$?
            echo "::warning::Deployment failed; restoring previous version"
            restore || true
            diagnose_deploy_failure "$rc"
          }
          trap rollback_on_error ERR
          cp .deploy-staging/main.py .deploy-staging/chzzk_replay_notifier.py .deploy-staging/cafe_notifier.py .deploy-staging/twitter_notifier.py .deploy-staging/twitter_huya_notifier.py .deploy-staging/youtube_notifier.py .deploy-staging/youtube_websub.py .deploy-staging/health_monitor.py .deploy-staging/delivery_review.py .deploy-staging/delivery_latency.py .deploy-staging/banner_manager.py .deploy-staging/creator_profiles.py .deploy-staging/creator_groups.py .deploy-staging/discord_v2.py .deploy-staging/notice_intelligence.py .deploy-staging/resilience.py .deploy-staging/test_alert.py .deploy-staging/test_image_card.py .deploy-staging/requirements.txt .deploy-staging/youtube_channels.txt .deploy-staging/x_post_media.py .deploy-staging/x_repost_notifier.py .deploy-staging/x_repost_delivery_ledger.py .deploy-staging/x_spaces_notifier.py .deploy-staging/x_feed_health.py .deploy-staging/x_fx_feed.py .deploy-staging/fanart_discovery.py .deploy-staging/fanart_url_media.py .deploy-staging/random_media.py .deploy-staging/guild_server_banner.py .deploy-staging/schedule_display.py .deploy-staging/fanart_public_stats.py .deploy-staging/guild_banner_timer_runner.py .deploy-staging/guild_banner_healthcheck.py .deploy-staging/clip_healthcheck.py .deploy-staging/fanart_fx_rss.py .deploy-staging/fanart_fx_search.py .deploy-staging/fanart_global_sources.py .deploy-staging/fanart_free_search.py .deploy-staging/fanart_artist_watch.py .deploy-staging/fanart_weekly_cleanup.py .deploy-staging/fanart_review.py .deploy-staging/fanart_library.py .deploy-staging/fanart_candidate_cache.py .deploy-staging/fanart_refresh.py .deploy-staging/fanart_usage.py .deploy-staging/fanart_relevance.py .deploy-staging/fanart_vision.py .deploy-staging/chzzk_clip_digest.py .deploy-staging/discord_message_sync.py .
          sudo systemctl restart chzzk-bot
          sleep 3
          sudo systemctl is-active --quiet chzzk-bot
          # Record the actual source revision independently of the server's git log:
          # deployment copies files over SSH and does not advance its local git HEAD.
          printf '%s\n' "$DEPLOY_SHA" > .deploy-staging/deployed_revision
          mv .deploy-staging/deployed_revision .deployed_revision
          echo "DEPLOYED_REVISION=$DEPLOY_SHA"
          trap - ERR
          echo "::endgroup::"
          echo "Deployment complete."
          REMOTE

      - name: Verify original Discord server banner information actually updates
        env:
          SSH_HOST: ${{ secrets.ORACLE_HOST }}
          SSH_USER: ${{ secrets.ORACLE_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/oracle_key -o IdentitiesOnly=yes "$SSH_USER@$SSH_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /home/ubuntu/chzzk-bot
          if [ -x .venv/bin/python ]; then BOT_PY=.venv/bin/python
          else BOT_PY=.venv-test/bin/python; fi
          "$BOT_PY" - <<'PY'
          import os
          from dotenv import load_dotenv
          load_dotenv("/home/ubuntu/chzzk-bot/.env")
          from guild_server_banner import sync_banner_info
          result = sync_banner_info(force=True)
          status = result.get("status", "")
          reason = result.get("reason", "")
          print("BANNER_INFO_DEPLOY_VERIFICATION status=%s reason=%s" % (status, reason))
          if status not in ("updated", "up_to_date"):
              raise SystemExit("Original banner info message was not updated; inspect Discord ownership/configuration")
          # Independently GET the existing Discord message and verify the visible
          # card fields. This distinguishes a successful PATCH from the UI the
          # user actually sees; never expose tokens or post contents in logs.
          import requests
          channel = os.environ["SERVER_BANNER_INFO_CHANNEL_ID"]
          message = os.environ["SERVER_BANNER_INFO_MESSAGE_ID"]
          token = os.environ["DISCORD_BOT_TOKEN"]
          response = requests.get(
              f"https://discord.com/api/v10/channels/{channel}/messages/{message}",
              headers={"Authorization": "Bot " + token}, timeout=12)
          response.raise_for_status()
          posted = response.json()
          if str(posted.get("id")) != message:
              raise SystemExit("Discord returned a different banner information message")
          parts = (posted.get("components") or [])
          def all_text(items):
              for item in items:
                  if isinstance(item, dict):
                      if item.get("type") == 10:
                          yield str(item.get("content") or "")
                      yield from all_text(item.get("components") or [])
          text = "\\n".join(all_text(parts))
          required = ("현재 적용된 서버 배너", "변경 방식", "변경 시각",
                      "원본 작가", "원본 게시물", "정기 업데이트",
                      "다음 업데이트", "업데이트까지", "팬아트 수집 현황",
                      "수집 게시글", "서버 배너용 후보", "알림 배너·팬아트 후보",
                      "마지막 수집 점검")
          if not all(value in text for value in required):
              raise SystemExit("Discord banner card still displays a previous layout")
          import re
          if not re.search(r"<t:\d+:R>", text) or not re.search(r"<t:\d+:F>", text):
              raise SystemExit("Discord banner countdown is missing relative or absolute timestamp")
          if not (int(posted.get("flags") or 0) & 32768):
              raise SystemExit("Discord banner card is missing Components V2 flag")
          from guild_server_banner import read_state
          provenance = read_state()
          print("BANNER_METADATA_LIVE audit=%s image_match=%s change_time_known=%s source_known=%s" % (
              provenance.get("banner_audit_status", "not_checked"),
              provenance.get("banner_source_match_status", "not_checked"),
              bool(provenance.get("banner_changed_at")),
              bool(provenance.get("artist") and provenance.get("post_url"))))
          print("BANNER_INFO_LIVE_VERIFIED all_five_fields=true original_message=true")
          PY
          REMOTE

      - name: Consolidate guild banner writes into the main bot
        env:
          SSH_HOST: ${{ secrets.ORACLE_HOST }}
          SSH_USER: ${{ secrets.ORACLE_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/oracle_key -o IdentitiesOnly=yes "$SSH_USER@$SSH_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /home/ubuntu/chzzk-bot
          if [ -x .venv/bin/python ]; then BOT_PY=.venv/bin/python
          else BOT_PY=.venv-test/bin/python; fi
          # A strict art-quality filter can legitimately leave fewer than two
          # candidates. Never fail deployment or revive the retired legacy
          # writer: the canonical scheduler safely holds the current banner.
          "$BOT_PY" - <<'PY'
          from dotenv import load_dotenv
          load_dotenv("/home/ubuntu/chzzk-bot/.env")
          from guild_server_banner import banner_inventory
          pool = banner_inventory()
          count = pool["total"]
          print("BANNER_CANONICAL_POOL eligible=%d unused=%d minimum=2" % (
              count, pool["unused"]))
          if count < 2:
              print("BANNER_CANONICAL_POOL_LOW safe_hold=true legacy_timer_must_remain_disabled")
          PY
          sudo systemctl is-active --quiet chzzk-bot.service
          if sudo systemctl list-unit-files --no-legend abyss-guild-banner.timer | grep -q 'abyss-guild-banner.timer'; then
            sudo systemctl disable --now abyss-guild-banner.timer
          fi
          if sudo systemctl is-active --quiet abyss-guild-banner.timer; then
            echo "Legacy server banner timer still active" >&2
            exit 1
          fi
          echo "BANNER_CONTROLLER=main-bot LEGACY_TIMER=disabled GITHUB_BACKUP=enabled"
          REMOTE

      - name: Capture redacted runtime health after deployment
        env:
          SSH_HOST: ${{ secrets.ORACLE_HOST }}
          SSH_USER: ${{ secrets.ORACLE_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/oracle_key -o IdentitiesOnly=yes "$SSH_USER@$SSH_HOST" 'bash -se' > bot-health.json <<'REMOTE'
          set -euo pipefail
          cd /home/ubuntu/chzzk-bot
          if [ -x .venv/bin/python ]; then BOT_PY=.venv/bin/python
          else BOT_PY=.venv-test/bin/python; fi
          "$BOT_PY" - <<'PY'
          import json
          from dotenv import load_dotenv
          # The deploy probe runs in its own Python process. Without loading
          # the same .env as main.py, configured flags and eligibility counts
          # are falsely reported as disabled/defaults.
          load_dotenv("/home/ubuntu/chzzk-bot/.env")
          from health_monitor import snapshot
          print(json.dumps(snapshot(), ensure_ascii=False, separators=(",", ":")))
          PY
          REMOTE
          python3 -m json.tool bot-health.json > /dev/null
          echo '### Production health snapshot (counts/status only)' >> "$GITHUB_STEP_SUMMARY"
          echo '~~~json' >> "$GITHUB_STEP_SUMMARY"
          cat bot-health.json >> "$GITHUB_STEP_SUMMARY"
          echo '~~~' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload redacted health report
        uses: actions/upload-artifact@v4
        with:
          name: bot-health-${{ github.sha }}
          path: bot-health.json
          retention-days: 7

      - name: Send one approved YouTube preview (no role mentions)
        if: ${{ github.event_name == 'push' && github.event.head_commit.message == 'Send single YouTube preview for approved unified design' }}
        env:
          SSH_HOST: ${{ secrets.ORACLE_HOST }}
          SSH_USER: ${{ secrets.ORACLE_USER }}
        run: |
          set -eu
          ssh -i ~/.ssh/oracle_key -o IdentitiesOnly=yes "$SSH_USER@$SSH_HOST" 'bash -se' <<'REMOTE'
          set -eu
          cd /home/ubuntu/chzzk-bot
          if [ -x .venv-test/bin/python ]; then
            .venv-test/bin/python test_alert.py --group hanayo --platform youtube --premium --send
          else
            .venv/bin/python test_alert.py --group hanayo --platform youtube --premium --send
          fi
          REMOTE

      - name: Report production deployment and banner verification status
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_RESULT: ${{ job.status }}
        run: |
          set -eu
          if [ "$DEPLOY_RESULT" = "success" ]; then
            state=success
            description="Server deployed; existing Discord banner card verified"
            if [ -f bot-health.json ]; then
              provenance=$(python3 - <<'PY'
          import json
          with open("bot-health.json", encoding="utf-8") as stream:
              data = json.load(stream)
          banner = data.get("banner", {})
          audit = banner.get("audit_status", "not_checked")
          source = "yes" if banner.get("source_known") else "no"
          changed = "yes" if banner.get("change_time_known") else "no"
          print("audit=%s source=%s time=%s" % (audit, source, changed))
          PY
              )
              description="Discord card verified; $provenance"
            fi
          else
            state=failure
            description="Deployment or live Discord banner verification failed"
          fi
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context="abyss/production-banner" \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/workflows/deploy.yml"
          # The GitHub connector exposes status contexts but not descriptions.
          # Store redacted audit/source/time flags in a separate context so
          # automated inspections can see *real* recovery outcomes.
          if [ "$DEPLOY_RESULT" = "success" ] && [ -f bot-health.json ]; then
            provenance_status=$(python3 -c 'import json,re; b=json.load(open("bot-health.json",encoding="utf-8")).get("banner",{}); a=re.sub("[^a-z0-9_]","_",str(b.get("audit_status","not_checked")).lower())[:30]; print("audit_%s-source_%s-time_%s"%(a,"yes" if b.get("source_known") else "no","yes" if b.get("change_time_known") else "no"))')
            gh api --method POST \
              "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
              -f state="success" \
              -f context="abyss/banner-provenance/$provenance_status" \
              -f description="Redacted server banner audit recovery outcome" \
              -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/workflows/deploy.yml"
          fi
