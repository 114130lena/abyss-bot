name: Deploy CHZZK Bot

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: chzzk-bot-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate bot Python files
        run: |
          python -m py_compile main.py chzzk_replay_notifier.py cafe_notifier.py twitter_notifier.py twitter_huya_notifier.py youtube_notifier.py youtube_websub.py health_monitor.py banner_manager.py creator_profiles.py creator_groups.py discord_v2.py notice_intelligence.py resilience.py test_alert.py test_image_card.py test_bot.py x_post_media.py x_repost_notifier.py x_feed_health.py x_fx_feed.py fanart_discovery.py fanart_url_media.py random_media.py guild_server_banner.py fanart_fx_rss.py fanart_candidate_cache.py fanart_review.py fanart_library.py fanart_refresh.py fanart_usage.py fanart_weekly_cleanup.py

      - name: Install Korean font for profile image headers
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-nanum

      - name: Install test dependencies and run regression tests
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -p 'test_x_*.py' -v
          python -m unittest discover -s tests -p 'test_restore_local_fanart.py' -v
          python -m unittest discover -s tests -p 'test_banner_cache_repair.py' -v
          python -m unittest -v test_guild_server_banner.py
          python -m unittest -v test_bot.py

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          SSH_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          set -eu
          test -n "$SSH_KEY"
          test -n "$SSH_HOST"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Upload bot source to temporary directory
        env:
          SSH_HOST: ${{ secrets.ORACLE_HOST }}
          SSH_USER: ${{ secrets.ORACLE_USER }}
        run: |
          set -eu
          ssh -i ~/.ssh/oracle_key -o IdentitiesOnly=yes "$SSH_USER@$SSH_HOST" \
            'mkdir -p /home/ubuntu/chzzk-bot/.deploy-staging'
          scp -i ~/.ssh/oracle_key -o IdentitiesOnly=yes \
            main.py chzzk_replay_notifier.py cafe_notifier.py twitter_notifier.py twitter_huya_notifier.py youtube_notifier.py youtube_websub.py health_monitor.py banner_manager.py creator_profiles.py creator_groups.py discord_v2.py notice_intelligence.py resilience.py test_alert.py test_image_card.py x_post_media.py x_repost_notifier.py x_feed_health.py x_fx_feed.py fanart_discovery.py fanart_url_media.py random_media.py guild_server_banner.py fanart_fx_rss.py fanart_candidate_cache.py fanart_review.py fanart_library.py fanart_refresh.py fanart_usage.py requirements.txt youtube_channels.txt \
            "$SSH_USER@$SSH_HOST:/home/ubuntu/chzzk-bot/.deploy-staging/"

      - name: Validate and deploy, then restart
        env:
          SSH_HOST: ${{ secrets.ORACLE_HOST }}
          SSH_USER: ${{ secrets.ORACLE_USER }}
        run: |
          ssh -i ~/.ssh/oracle_key -o IdentitiesOnly=yes "$SSH_USER@$SSH_HOST" 'bash -se' <<'REMOTE'
          set -Eeuo pipefail
          diagnose_deploy_failure() {
            rc=${1:-$?}
            echo "::error::Remote deployment failed at line ${BASH_LINENO[0]:-unknown} (exit $rc)"
            echo "Service state (metadata only; no environment or webhook values):"
            sudo systemctl show chzzk-bot --no-pager \
              --property=LoadState,ActiveState,SubState,Result,ExecMainCode,ExecMainStatus,Restart,MainPID || true
            exit "$rc"
          }
          trap diagnose_deploy_failure ERR
          cd /home/ubuntu/chzzk-bot
          echo "::group::Validate staged Python and dependencies"
          # Prefer the production environment, but support servers using the
          # separately-created test venv rather than failing with ENOENT.
          if [ -x .venv/bin/python ]; then
            BOT_PY=.venv/bin/python
          elif [ -x .venv-test/bin/python ]; then
            BOT_PY=.venv-test/bin/python
          else
            echo "::error::No Python virtualenv found (.venv or .venv-test)."
            exit 1
          fi
          echo "Using Python: $BOT_PY"
          "$BOT_PY" -m py_compile .deploy-staging/main.py .deploy-staging/chzzk_replay_notifier.py .deploy-staging/cafe_notifier.py .deploy-staging/twitter_notifier.py .deploy-staging/twitter_huya_notifier.py .deploy-staging/youtube_notifier.py .deploy-staging/youtube_websub.py .deploy-staging/health_monitor.py .deploy-staging/banner_manager.py .deploy-staging/creator_profiles.py .deploy-staging/creator_groups.py .deploy-staging/discord_v2.py .deploy-staging/notice_intelligence.py .deploy-staging/resilience.py .deploy-staging/test_alert.py .deploy-staging/test_image_card.py .deploy-staging/x_post_media.py .deploy-staging/x_repost_notifier.py .deploy-staging/x_feed_health.py .deploy-staging/x_fx_feed.py .deploy-staging/fanart_discovery.py .deploy-staging/fanart_url_media.py .deploy-staging/random_media.py .deploy-staging/guild_server_banner.py .deploy-staging/fanart_fx_rss.py .deploy-staging/fanart_candidate_cache.py .deploy-staging/fanart_review.py .deploy-staging/fanart_library.py .deploy-staging/fanart_refresh.py .deploy-staging/fanart_usage.py
          "$BOT_PY" -m pip install -r .deploy-staging/requirements.txt

          echo "::endgroup::"
          echo "::group::Backup and activate bot version"
          backup_dir=$(mktemp -d /tmp/chzzk-bot-backup.XXXXXX)
          cp main.py cafe_notifier.py twitter_notifier.py requirements.txt "$backup_dir/"
          if [ -f twitter_huya_notifier.py ]; then cp twitter_huya_notifier.py "$backup_dir/"; fi
          if [ -f chzzk_replay_notifier.py ]; then cp chzzk_replay_notifier.py "$backup_dir/"; fi
          if [ -f youtube_notifier.py ]; then cp youtube_notifier.py "$backup_dir/"; fi
          if [ -f youtube_channels.txt ]; then cp youtube_channels.txt "$backup_dir/"; fi
          if [ -f resilience.py ]; then cp resilience.py "$backup_dir/"; fi
          if [ -f youtube_websub.py ]; then cp youtube_websub.py "$backup_dir/"; fi
          if [ -f health_monitor.py ]; then cp health_monitor.py "$backup_dir/"; fi
          if [ -f banner_manager.py ]; then cp banner_manager.py "$backup_dir/"; fi
          if [ -f creator_groups.py ]; then cp creator_groups.py "$backup_dir/"; fi
          if [ -f creator_profiles.py ]; then cp creator_profiles.py "$backup_dir/"; fi
          if [ -f discord_v2.py ]; then cp discord_v2.py "$backup_dir/"; fi
          if [ -f notice_intelligence.py ]; then cp notice_intelligence.py "$backup_dir/"; fi
          if [ -f test_alert.py ]; then cp test_alert.py "$backup_dir/"; fi
          if [ -f test_image_card.py ]; then cp test_image_card.py "$backup_dir/"; fi
          # Backup every optional runtime module; preserve absence for rollback.
          for module in x_post_media.py x_repost_notifier.py x_feed_health.py x_fx_feed.py fanart_discovery.py fanart_url_media.py random_media.py guild_server_banner.py fanart_fx_rss.py fanart_candidate_cache.py fanart_review.py fanart_library.py fanart_refresh.py fanart_usage.py; do
            if [ -f "$module" ]; then cp "$module" "$backup_dir/"; fi
          done
          restore() {
            cp "$backup_dir/main.py" "$backup_dir/cafe_notifier.py" "$backup_dir/twitter_notifier.py" "$backup_dir/requirements.txt" .
            if [ -f "$backup_dir/twitter_huya_notifier.py" ]; then cp "$backup_dir/twitter_huya_notifier.py" .; else rm -f twitter_huya_notifier.py; fi
            if [ -f "$backup_dir/chzzk_replay_notifier.py" ]; then cp "$backup_dir/chzzk_replay_notifier.py" .; else rm -f chzzk_replay_notifier.py; fi
            if [ -f "$backup_dir/youtube_notifier.py" ]; then cp "$backup_dir/youtube_notifier.py" .; else rm -f youtube_notifier.py; fi
            if [ -f "$backup_dir/youtube_channels.txt" ]; then cp "$backup_dir/youtube_channels.txt" .; else rm -f youtube_channels.txt; fi
            if [ -f "$backup_dir/resilience.py" ]; then cp "$backup_dir/resilience.py" .; else rm -f resilience.py; fi
            if [ -f "$backup_dir/youtube_websub.py" ]; then cp "$backup_dir/youtube_websub.py" .; else rm -f youtube_websub.py; fi
            if [ -f "$backup_dir/health_monitor.py" ]; then cp "$backup_dir/health_monitor.py" .; else rm -f health_monitor.py; fi
            if [ -f "$backup_dir/banner_manager.py" ]; then cp "$backup_dir/banner_manager.py" .; else rm -f banner_manager.py; fi
            if [ -f "$backup_dir/creator_groups.py" ]; then cp "$backup_dir/creator_groups.py" .; else rm -f creator_groups.py; fi
            if [ -f "$backup_dir/creator_profiles.py" ]; then cp "$backup_dir/creator_profiles.py" .; else rm -f creator_profiles.py; fi
            if [ -f "$backup_dir/discord_v2.py" ]; then cp "$backup_dir/discord_v2.py" .; else rm -f discord_v2.py; fi
            if [ -f "$backup_dir/notice_intelligence.py" ]; then cp "$backup_dir/notice_intelligence.py" .; else rm -f notice_intelligence.py; fi
            if [ -f "$backup_dir/test_alert.py" ]; then cp "$backup_dir/test_alert.py" .; else rm -f test_alert.py; fi
            if [ -f "$backup_dir/test_image_card.py" ]; then cp "$backup_dir/test_image_card.py" .; else rm -f test_image_card.py; fi
            for module in x_post_media.py x_repost_notifier.py x_feed_health.py x_fx_feed.py fanart_discovery.py fanart_url_media.py random_media.py guild_server_banner.py fanart_fx_rss.py fanart_candidate_cache.py fanart_review.py fanart_library.py fanart_refresh.py fanart_usage.py; do
              if [ -f "$backup_dir/$module" ]; then cp "$backup_dir/$module" .; else rm -f "$module"; fi
            done
            sudo systemctl restart chzzk-bot
          }
          rollback_on_error() {
            rc=$?
            echo "::warning::Deployment failed; restoring previous version"
            restore || true
            diagnose_deploy_failure "$rc"
          }
          trap rollback_on_error ERR
          cp .deploy-staging/main.py .deploy-staging/chzzk_replay_notifier.py .deploy-staging/cafe_notifier.py .deploy-staging/twitter_notifier.py .deploy-staging/twitter_huya_notifier.py .deploy-staging/youtube_notifier.py .deploy-staging/youtube_websub.py .deploy-staging/health_monitor.py .deploy-staging/banner_manager.py .deploy-staging/creator_profiles.py .deploy-staging/creator_groups.py .deploy-staging/discord_v2.py .deploy-staging/notice_intelligence.py .deploy-staging/resilience.py .deploy-staging/test_alert.py .deploy-staging/test_image_card.py .deploy-staging/requirements.txt .deploy-staging/youtube_channels.txt .deploy-staging/x_post_media.py .deploy-staging/x_repost_notifier.py .deploy-staging/x_feed_health.py .deploy-staging/x_fx_feed.py .deploy-staging/fanart_discovery.py .deploy-staging/fanart_url_media.py .deploy-staging/random_media.py .deploy-staging/guild_server_banner.py .deploy-staging/fanart_fx_rss.py .deploy-staging/fanart_candidate_cache.py .deploy-staging/fanart_review.py .deploy-staging/fanart_library.py .deploy-staging/fanart_refresh.py .deploy-staging/fanart_usage.py .
          sudo systemctl restart chzzk-bot
          sleep 3
          sudo systemctl is-active --quiet chzzk-bot
          trap - ERR
          echo "::endgroup::"
          echo "Deployment complete."
          REMOTE

      - name: Send one approved YouTube preview (no role mentions)
        if: ${{ github.event_name == 'push' && github.event.head_commit.message == 'Send single YouTube preview for approved unified design' }}
        env:
          SSH_HOST: ${{ secrets.ORACLE_HOST }}
          SSH_USER: ${{ secrets.ORACLE_USER }}
        run: |
          set -eu
          ssh -i ~/.ssh/oracle_key -o IdentitiesOnly=yes "$SSH_USER@$SSH_HOST" 'bash -se' <<'REMOTE'
          set -eu
          cd /home/ubuntu/chzzk-bot
          if [ -x .venv-test/bin/python ]; then
            .venv-test/bin/python test_alert.py --group hanayo --platform youtube --premium --send
          else
            .venv/bin/python test_alert.py --group hanayo --platform youtube --premium --send
          fi
          REMOTE
