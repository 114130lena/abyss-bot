name: Abyss integration validation
on:
  push:
    branches:
      - integration/abyss-x-media-fanart-20261105
  pull_request:
    paths:
      - 'main.py'
      - 'resilience.py'
      - 'twitter_*'
      - 'x_*'
      - 'fanart_*'
      - 'random_media.py'
      - 'guild_server_banner.py'
      - 'tests/**'
      - 'test_guild_server_banner.py'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/abyss-integration-tests.yml'
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile runtime modules
        run: python -m py_compile main.py resilience.py discord_v2.py twitter_notifier.py twitter_huya_notifier.py x_repost_notifier.py x_post_media.py x_feed_health.py x_fx_feed.py fanart_discovery.py fanart_url_media.py random_media.py guild_server_banner.py
      - name: Check repost, photo, fanart routing and consent
        run: python -m unittest discover -s tests -p 'test_x_*.py' -v
      - name: Check existing local fanart restoration and attachment delivery
        run: python -m unittest discover -s tests -p 'test_restore_local_fanart.py' -v
      - name: Check restored banner, weekly prune and exclusion ledger
        run: python -m unittest discover -s tests -p 'test_banner_cache_repair.py' -v
      - name: Check guild banner, schedule and dry-run
        run: python -m unittest -v test_guild_server_banner.py
      - name: Existing baseline tests
        run: python -m unittest -v test_bot.py

  fanart_collection_audit:
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/fanart-footer-pool-audit-20261105'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify recurring Oracle fanart collector activity without modifying data
        env:
          SSH_HOST: ${{ secrets.ORACLE_HOST }}
          SSH_USER: ${{ secrets.ORACLE_USER }}
          SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_HOST" && test -n "$SSH_USER" && test -n "$SSH_KEY"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/fanart_audit_key
          chmod 600 ~/.ssh/fanart_audit_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          ssh -o IdentitiesOnly=yes -i ~/.ssh/fanart_audit_key "$SSH_USER@$SSH_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /home/ubuntu/chzzk-bot
          python3 - <<'PY'
          import json, pathlib, datetime
          from zoneinfo import ZoneInfo
          root=pathlib.Path("creator_media")
          queue=root/"fanart_discovery.json"
          d=json.loads(queue.read_text("utf-8")) if queue.is_file() else {}
          s={}
          for group in ("hanayo","sakihane"):
              items=[v for v in d.values() if isinstance(v,dict) and v.get('group')==group]
              s[group]={"posts":len(items),"cached_images":sum(len(v.get("cached_files",[])) for v in items)}
          s["queue_last_modified_kst"]=datetime.datetime.fromtimestamp(queue.stat().st_mtime,ZoneInfo("Asia/Seoul")).isoformat() if queue.is_file() else None
          s["checked_kst"]=datetime.datetime.now(ZoneInfo("Asia/Seoul")).isoformat()
          print("FANART_COLLECTION_INVENTORY "+json.dumps(s,ensure_ascii=False))
          PY
          echo FANART_COLLECTION_EVENTS_LAST_12H
          sudo journalctl -u chzzk-bot.service --since '12 hours ago' --no-pager -o short-iso | grep -E 'FANART_DISCOVERY_PROFILE|FANART_DISCOVERY_API|FANART_REVIEW_CACHE|팬아트 후보 수집|fanart-discovery' | tail -n 30 || true
          echo FANART_COLLECTION_EVENTS_LAST_24H_COUNT
          sudo journalctl -u chzzk-bot.service --since '24 hours ago' --no-pager -o cat | grep -c 'FANART_DISCOVERY_PROFILE' || true
          REMOTE

  recent_x_routing_audit:
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/repost-routing-20261106'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect last 12 hours of X delivered and repost routing logs, read-only
        env:
          SSH_HOST: ${{ secrets.ORACLE_HOST }}
          SSH_USER: ${{ secrets.ORACLE_USER }}
          SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_HOST" && test -n "$SSH_USER" && test -n "$SSH_KEY"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/key -o IdentitiesOnly=yes "$SSH_USER@$SSH_HOST" 'bash -se' <<'REMOTE'
          echo "AUDIT_KST $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M:%S')"
          sudo journalctl -u chzzk-bot.service --since '12 hours ago' --no-pager -o short-iso |
            grep -E 'X 새 게시글 알림 성공|후야 X 새 글 알림|X_REPOST_DISCOVERED|X_REPOST_DELIVERED|X_REPOST_TOTAL|X_REPOST_MEDIA_RESOLVED|X_SEND_MEDIA_GUARD|X_FX_FEED|X_FX_REPOST_SCAN|Discord response timed out' |
            tail -n 120 || true
          REMOTE

  full_bot_health_audit:
    if: github.event_name == 'pull_request' && github.head_ref == 'audit/full-bot-health-20261106'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read-only Oracle bot platform, timer and errors audit
        env:
          SSH_HOST: ${{ secrets.ORACLE_HOST }}
          SSH_USER: ${{ secrets.ORACLE_USER }}
          SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_HOST" && test -n "$SSH_USER" && test -n "$SSH_KEY"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/audit_key
          chmod 600 ~/.ssh/audit_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/audit_key -o IdentitiesOnly=yes "$SSH_USER@$SSH_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /home/ubuntu/chzzk-bot
          echo "NOW_KST $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M:%S')"
          echo "LINKS_RUNTIME_AUDIT"
          python3 - <<'PY'
          import os, re, pathlib
          from urllib.parse import urlparse
          root=pathlib.Path('/home/ubuntu/chzzk-bot')
          env=dict(line.split('=',1) for line in (root/'.env').read_text().splitlines() if '=' in line and not line.lstrip().startswith('#'))
          for k in ('HANAYO_CHZZK_URL','SAKIHANE_CHZZK_URL','STELLIVE_CAFE_URL','YOUTUBE_THREAD_ID','CHZZK_REPLAY_THREAD_ID'):
              v=env.get(k, '')
              if k.endswith('_CHZZK_URL') or k.endswith('_CAFE_URL'):
                  if v:
                      url=urlparse(v)
                      label='correct_host' if url.hostname in ('chzzk.naver.com','cafe.naver.com') else 'OTHER_HOST'
                      print(k, label, v[:160])
                  else:
                      print(k,'NOT_SET')
              else: print(k, 'CONFIGURED' if v else 'DEFAULT')
          channels=[x.strip() for x in (root/'channels.txt').read_text().splitlines() if x.strip() and not x.startswith('#')]
          print('MONITORED_CHZZK_IDS',[(cid, bool(re.fullmatch(r'[0-9a-f]{32}',cid))) for cid in channels])
          print('DEPLOYED_CHZZK_LIVE_LINK_FIX', 'live/{channel_id}' in (root/'main.py').read_text())
          print('DEPLOYED_CHZZK_REPLAY_LINK_FIX', 'https://chzzk.naver.com/video/' in (root/'chzzk_replay_notifier.py').read_text())
          PY

          echo "REPLAY_CHANNEL_CONFIGURATION"
          grep -i 'Hiyorireplay' youtube_channels.txt || true
          echo "REPLAY_ID_CACHE"
          python3 - <<'PY'
          import json,pathlib
          path=pathlib.Path("youtube_handle_ids.json")
          data=json.loads(path.read_text()) if path.exists() else {}
          print("replay_id="+str(data.get("@Hiyorireplay","UNRESOLVED")))
          PY
          echo "REPLAY_LOGS_LAST_2H"
          sudo journalctl -u chzzk-bot.service --since '2 hours ago' --no-pager -o cat | grep -Ei 'Hiyorireplay|YouTube WebSub subscription|YOUTUBE_WEBSUB_VERIFIED|YouTube handle|YouTube .*initialized|YouTube .*failed' | tail -n 50 || true

          for u in chzzk-bot.service abyss-guild-banner.timer abyss-media-refresh.timer abyss-guild-banner.service; do
            echo "UNIT $u $(systemctl is-active "$u" 2>/dev/null || true)"
          done
          echo "TIMERS"
          systemctl list-timers --all --no-pager | grep -E 'abyss|chzzk' || true
          echo "BOT_LOG_COUNTS_24H"
          sudo journalctl -u chzzk-bot.service --since '24 hours ago' --no-pager -o cat | python3 -c '
          import sys,collections
          lines=sys.stdin
          keys=["ERROR","Traceback","failure #","WARNING","X 새 게시글 알림 성공","후야 X 새 글 알림","X_REPOST_DELIVERED","X_REPOST_DISCOVERED","X_FX_FEED","X_MEDIA_TEXT_ONLY_VERIFIED","X_MEDIA_RECHECK_FAILED","X_MEDIA_RECHECK_UNVERIFIED","X_MEDIA_UNVERIFIED_EMPTY","X_FANART_BLOCKED","FANART_SELECTED","FANART_DISCOVERY_PROFILE","FANART_REVIEW_CACHE","YouTube","유튜브","카페","치지직","WEBHOOK_DELIVERED","NAVER","X RSS 서버 조회 실패","DISCORD_WEBHOOK_DELIVERED"]
          n=collections.Counter()
          for line in lines:
              for k in keys:
                  if k in line:n[k]+=1
          print(" ".join("%s=%d"%(k.replace(" ","_"),n[k]) for k in keys))
          '
          echo "RECENT_PROBLEMS_24H"
          sudo journalctl -u chzzk-bot.service --since '24 hours ago' --no-pager -o cat |
            grep -Ei 'ERROR|Traceback|failure #|X RSS 서버 조회 실패|후야 X RSS 소스 실패|FANART_FALLBACK|팬아트 링크 선택 실패|MEDIA_RECHECK_FAILED|NAVER_CAFE|HTTPError|Timeout' | tail -n 55 | sed -E 's#https?://[^ ]+#<URL>#g' || true
          echo "PLATFORM_LAST_EVENTS_24H"
          sudo journalctl -u chzzk-bot.service --since '24 hours ago' --no-pager -o short-iso |
            grep -E 'X 새 게시글 알림 성공|후야 X 새 글 알림|X_REPOST_DELIVERED|FANART_SELECTED|FANART_DISCOVERY_PROFILE|디스코드 알림 전송 성공|유튜브.*알림|카페.*알림|YouTube banner updated|X_MEDIA_TEXT_ONLY_VERIFIED' | tail -n 45 | sed -E 's#https?://[^ ]+#<URL>#g' || true
          echo "WARNING_FAMILIES_24H"
          sudo journalctl -u chzzk-bot.service --since '24 hours ago' --no-pager -o cat | python3 -c '
          import sys,collections,re
          hits=collections.Counter()
          for line in sys.stdin:
              if " [WARNING] " not in line and " [ERROR] " not in line: continue
              msg=line.split("] ",1)[-1]
              msg=re.sub(r"https?://\\S+","<URL>",msg)
              msg=re.sub(r"\\b\\d{12,}\\b","<ID>",msg)
              msg=re.sub(r"(?:HTTP|HTTPS)ConnectionPool\\([^)]*\\)","HTTPConnectionPool(<HOST>)",msg)
              hits[msg[:75]]+=1
          for key,n in hits.most_common(20):print(n,key)
          '
          echo "ALL_SERVICES_RECENT_FAILURES"
          for unit in abyss-media-refresh.service abyss-fanart-rss-review.service abyss-official-profiles.service abyss-hiyoriclip-collector.service abyss-chzzk-hiyoriclip-collector.service; do
            echo "$unit: $(systemctl show "$unit" --property=Result --value 2>/dev/null || true)"
          done
          echo "BANNER_LAST_EVENTS"
          sudo journalctl -u abyss-guild-banner.service --since '30 hours ago' --no-pager -o cat | tail -n 20 || true
          echo "MEDIA_REFRESH_EVENTS"
          sudo journalctl -u abyss-media-refresh.service --since '30 hours ago' --no-pager -o cat | tail -n 12 || true
          echo 'WEBSUB_SETUP'
          for key in YOUTUBE_WEBSUB_CALLBACK_URL YOUTUBE_WEBSUB_SECRET YOUTUBE_WEBSUB_PORT; do
            if grep -q "^$key=" .env; then
              if [ "$key" = YOUTUBE_WEBSUB_CALLBACK_URL ]; then
                value=$(grep -m1 "^$key=" .env | cut -d= -f2-)
                case "$value" in https://*) echo "$key=HTTPS_CONFIGURED";; *) echo "$key=INVALID_OR_EMPTY";; esac
              else
                echo "$key=CONFIGURED"
              fi
            else echo "$key=ABSENT"; fi
          done
          echo "WEBSUB_LISTEN $(ss -lnt | grep -c ':8765 ' || true)"
          echo "PROXY_TOOLS"
          for tool in caddy nginx certbot tailscale cloudflared; do command -v "$tool" || true; done
          echo "PROXY_UNITS"
          for unit in caddy nginx apache2 cloudflared tailscaled; do echo "$unit=$(systemctl is-active "$unit" 2>/dev/null || true)"; done
          echo "PROXY_WEB_CONF_EXISTS"
          for file in /etc/caddy/Caddyfile /etc/nginx/sites-enabled/default; do if [ -f "$file" ]; then echo "$file yes"; fi; done
          echo "OPTIONS"
          for key in ABYSS_RANDOM_MEDIA ABYSS_NOTIFICATION_FANART FANART_DISCOVERY_ENABLED FANART_CACHE_CANDIDATES SERVER_BANNER_USE_COLLECTED SERVER_BANNER_ALLOW_FIT; do
            value=$(grep -m1 "^$key=" .env | cut -d= -f2- || true)
            case "$value" in 0|1|true|false) echo "$key=$value";; *) echo "$key=default_or_unset";; esac
          done
          REMOTE
