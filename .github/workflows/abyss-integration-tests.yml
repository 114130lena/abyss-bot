name: Abyss integration validation
on:
  push:
    branches:
      - integration/abyss-x-media-fanart-20261105
  pull_request:
    paths:
      - 'main.py'
      - 'resilience.py'
      - 'twitter_*'
      - 'x_*'
      - 'fanart_*'
      - 'random_media.py'
      - 'guild_server_banner.py'
      - 'tests/**'
      - 'test_guild_server_banner.py'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/abyss-integration-tests.yml'
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile runtime modules
        run: python -m py_compile main.py resilience.py discord_v2.py twitter_notifier.py twitter_huya_notifier.py x_repost_notifier.py x_post_media.py x_feed_health.py x_fx_feed.py fanart_discovery.py fanart_url_media.py random_media.py guild_server_banner.py
      - name: Check repost, photo, fanart routing and consent
        run: python -m unittest discover -s tests -p 'test_x_*.py' -v
      - name: Check existing local fanart restoration and attachment delivery
        run: python -m unittest discover -s tests -p 'test_restore_local_fanart.py' -v
      - name: Check restored banner, weekly prune and exclusion ledger
        run: python -m unittest discover -s tests -p 'test_banner_cache_repair.py' -v
      - name: Check guild banner, schedule and dry-run
        run: python -m unittest -v test_guild_server_banner.py
      - name: Existing baseline tests
        run: python -m unittest -v test_bot.py

  banner_1800_diagnose:
    if: github.event_name == 'pull_request' && github.head_ref == 'inspect/banner-1800-20261105'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Read-only Oracle 18:00 KST banner status
        env:
          SSH_HOST: ${{ secrets.ORACLE_HOST }}
          SSH_USER: ${{ secrets.ORACLE_USER }}
          SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_HOST" && test -n "$SSH_USER" && test -n "$SSH_KEY"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/abyss_probe_key
          chmod 600 ~/.ssh/abyss_probe_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/abyss_probe_key -o IdentitiesOnly=yes "$SSH_USER@$SSH_HOST" 'bash -se' <<'REMOTE'
          cd /home/ubuntu/chzzk-bot
          echo "DIAG_KST_DATE $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M:%S %Z')"
          for unit in chzzk-bot.service abyss-guild-banner.timer abyss-guild-banner.service; do
            echo "DIAG_UNIT $unit $(systemctl is-active "$unit" 2>/dev/null || true) $(systemctl is-enabled "$unit" 2>/dev/null || true)"
          done
          systemctl list-timers --all --no-pager | grep -E 'guild-banner|media-refresh' || true
          echo DIAG_FILES
          for file in guild_banner_timer_runner.py guild_banner_healthcheck.py guild_server_banner.py .guild_banner_auth.env; do
            if test -f "$file"; then echo "$file exists"; else echo "$file missing"; fi
          done
          if [ -x .venv/bin/python ]; then PY=.venv/bin/python; else PY=.venv-test/bin/python; fi
          "$PY" - <<'PY'
          import json,pathlib,os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          base=pathlib.Path('/home/ubuntu/chzzk-bot/creator_media')
          def load(path):
              try:
                  x=json.loads(path.read_text('utf-8'))
                  return x if isinstance(x,dict) else {}
              except (OSError,ValueError):return {}
          idx=load(base/'fanart_index.json')
          q=load(base/'fanart_discovery.json')
          state=load(base/'guild_banner_rotation_state.json')
          entries=idx.get('hanayo',[]) if isinstance(idx.get('hanayo'),list) else []
          data={'state_last_slot':state.get('last_slot'),'state_last_sha_present':bool(state.get('last_sha256')),
                'rotated_artworks':len(state.get('rotation_used',[])) if isinstance(state.get('rotation_used'),list) else 0,
                'approved_hanayo':sum(bool(isinstance(x,dict) and x.get('approved') is True and x.get('permission_confirmed') is True) for x in entries),
                'collected_hanayo_posts':sum(bool(isinstance(x,dict) and x.get('group')=='hanayo') for x in q.values()),
                'auth_file_exists':pathlib.Path('.guild_banner_auth.env').is_file(),
                'auth_permissions':oct(pathlib.Path('.guild_banner_auth.env').stat().st_mode & 0o777) if pathlib.Path('.guild_banner_auth.env').exists() else 'missing'}
          try:
              import guild_server_banner as m
              data['main_banner_eligible_count']=len(m.approved_hanayo_art())+len(m.collected_hanayo_art())
              data['current_slot']=m.slot()
              data['dry_run']=m.rotate_once(manual=True,dry_run=True).get('status')
          except Exception as exc:data['main_banner_import_error']=type(exc).__name__+': '+str(exc)[:150]
          print('BANNER_1800_DIAGNOSTIC '+json.dumps(data,ensure_ascii=False))
          PY
          echo "DIAG_BANNER_UNIT" 
          systemctl cat abyss-guild-banner.service | grep -E '^ExecStart=|^EnvironmentFile=|^WorkingDirectory=|^Type=' || true
          echo "DIAG_BANNER_RUNNER" 
          if [ -f guild_banner_timer_runner.py ]; then grep -nE 'def |return |status|error|sys.exit|exit\(|rotation|candidate|no_|success|failed|changed|SOURCE|auth|enable' guild_banner_timer_runner.py | head -n 100; fi
          echo "DIAG_SERVER_POOL"
          "$PY" - <<'PY'
          import json,pathlib
          from PIL import Image
          root=pathlib.Path('creator_media')
          q=json.loads((root/'fanart_discovery.json').read_text('utf-8'))
          c={'entries':0,'file_references':0,'file_exists':0,'widescreen':0,'fit':0,'blocked':0}
          for v in q.values():
              if not isinstance(v,dict) or v.get('group')!='hanayo':continue
              c['entries']+=1
              if v.get('review_status')=='blocked' or v.get('decision')=='blocked':c['blocked']+=1;continue
              for rel in v.get('cached_files',[]):
                  if not isinstance(rel,str):continue
                  c['file_references']+=1
                  p=root/rel
                  if not p.is_file():continue
                  c['file_exists']+=1
                  with Image.open(p) as img:w,h=img.size
                  a=w/max(h,1)
                  if w>=960 and h>=540 and (abs(a-16/9)<=.035 or abs(a-16/10)<=.03):c['widescreen']+=1
                  if w>=600 and h>=600 and .5<=a<=2.5:c['fit']+=1
          print('DIAG_IMAGE_DIMENSIONS '+json.dumps(c))
          PY
          echo "DIAG_POST_DEPLOY_20261105"
          echo "DIAG_BANNER_LOGS_START"
          sudo journalctl -u abyss-guild-banner.service --since '2026-11-05 08:40 UTC' --no-pager -o cat | tail -n 40 || true
          sudo journalctl -u chzzk-bot.service --since '2026-11-05 08:40 UTC' --no-pager -o cat | grep -Ei 'banner|배너' | tail -n 35 || true
          REMOTE
