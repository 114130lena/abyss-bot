name: Banner secret deploy tests

on:
  pull_request:
    paths:
      - 'scripts/configure_banner_env.py'
      - 'tests/test_banner_secret_config.py'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/banner-secret-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  banner-secret:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_banner_secret_config.py' -v
