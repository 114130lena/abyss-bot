name: Recover missed 08 KST guild banner rotation
on:
  push:
    branches: [feature/hanayo-approved-fanart-server-banner]
    paths: [.github/workflows/recover-missed-morning-banner.yml]
permissions:
  contents: read
concurrency:
  group: abyss-guild-banner-update
  cancel-in-progress: false
jobs:
  recover-morning:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/hanayo-approved-fanart-server-banner
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'Pillow>=10,<13' 'requests>=2.30,<3'
      - name: Prepare media SSH
        env:
          SSH_HOST: ${{ secrets.ORACLE_HOST }}
          SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_HOST" && test -n "$SSH_KEY"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
      - name: Recover exact scheduled 08 KST slot once (no duplicate)
        env:
          SSH_HOST: ${{ secrets.ORACLE_HOST }}
          SSH_USER: ${{ secrets.ORACLE_USER }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          GITHUB_EVENT_NAME: schedule
          GITHUB_SCHEDULE: '0,15,30,45 23 * * *'
        run: python -u scripts/guild_banner_actions.py
