name: Backup check for Hanayo Discord server banner

on:
  schedule:
    # Primary: Oracle systemd every 5m during 08:xx/18:xx Korea time.
    # Backup: 08:27/08:47 and 18:27/18:47 Korea time, away from 5m ticks.
    - cron: '27,47 23 * * *'
    - cron: '27,47 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: abyss-guild-banner-update
  cancel-in-progress: false

jobs:
  backup:
    if: github.repository == '114130lena/abyss-bot'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Prepare existing SSH connection
        env:
          SSH_HOST: ${{ secrets.ORACLE_HOST }}
          SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_HOST" && test -n "$SSH_KEY"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
      - name: Confirm or recover the KST banner slot on Oracle
        env:
          SSH_HOST: ${{ secrets.ORACLE_HOST }}
          SSH_USER: ${{ secrets.ORACLE_USER }}
        run: |
          set -euo pipefail
          test -n "$SSH_HOST" && test -n "$SSH_USER"
          ssh -i ~/.ssh/oracle_key -o IdentitiesOnly=yes "$SSH_USER@$SSH_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /home/ubuntu/chzzk-bot
          # Canonical banner runner loads production .env; never use the
          # legacy timer's separate auth/configuration or rotation database.
          test -f .env
          if [ -x .venv/bin/python ]; then PY=.venv/bin/python; else PY=.venv-test/bin/python; fi
          /usr/bin/flock -w 120 creator_media/guild_banner_rotation.lock "$PY" guild_banner_timer_runner.py
          REMOTE
