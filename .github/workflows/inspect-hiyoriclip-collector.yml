name: Inspect actual Hiyoriclip collector results on Oracle
on:
  push:
    branches: [feature/hiyoriclip-daily-recommendation]
    paths: [.github/workflows/inspect-hiyoriclip-collector.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Inspect timer and collect metadata once without Discord writes
        env:
          SSH_HOST: ${{ secrets.ORACLE_HOST }}
          SSH_USER: ${{ secrets.ORACLE_USER }}
          SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/oracle_key -o IdentitiesOnly=yes "$SSH_USER@$SSH_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /home/ubuntu/chzzk-bot
          systemctl is-active abyss-hiyoriclip-collector.timer
          systemctl list-timers --all abyss-hiyoriclip-collector.timer --no-pager
          if [ -x .venv/bin/python ]; then PY=.venv/bin/python; else PY=.venv-test/bin/python; fi
          /usr/bin/flock -w 60 creator_media/hiyoriclip_collection.lock "$PY" hiyoriclip_collector.py
          "$PY" hiyoriclip_collector.py --show
          REMOTE
