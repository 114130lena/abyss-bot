name: Install guild banner module (no credentials)
# Validate five banner hardening improvements before copying the isolated module.
# Collected-art selection preview; no Discord banner writes.
on:
  push:
    branches: [feature/hanayo-approved-fanart-server-banner]
    paths: [.github/workflows/install-guild-banner-module.yml]
permissions:
  contents: read
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline regression tests
        run: |
          python -m pip install -r requirements.txt
          python -m unittest -v test_guild_server_banner.py test_guild_banner_info_card.py
          python -m py_compile guild_server_banner.py scripts/guild_banner_actions.py scripts/guild_banner_info_card.py scripts/guild_banner_sync_card.py
      - name: Install isolated module and inspect approved art
        env:
          SSH_HOST: ${{ secrets.ORACLE_HOST }}
          SSH_USER: ${{ secrets.ORACLE_USER }}
          SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          scp -i ~/.ssh/oracle_key -o IdentitiesOnly=yes guild_server_banner.py guild_banner_timer_runner.py "$SSH_USER@$SSH_HOST:/home/ubuntu/chzzk-bot/"
          ssh -i ~/.ssh/oracle_key -o IdentitiesOnly=yes "$SSH_USER@$SSH_HOST" 'cd /home/ubuntu/chzzk-bot && if [ -x .venv/bin/python ]; then PY=.venv/bin/python; else PY=.venv-test/bin/python; fi; "$PY" -m py_compile guild_server_banner.py guild_banner_timer_runner.py && SERVER_BANNER_USE_COLLECTED=1 SERVER_BANNER_ALLOW_FIT=1 "$PY" guild_server_banner.py --output /tmp/abyss-banner-dryrun.jpg'
