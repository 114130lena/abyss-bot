name: One-time replacement of ineligible Hanayo guild banner
on:
  push:
    branches:
      - repair/replace-ineligible-banner-20261108
jobs:
  replace-ineligible-banner:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Replace currently ineligible banner once without changing notifications
        env:
          SSH_HOST: ${{ secrets.ORACLE_HOST }}
          SSH_USER: ${{ secrets.ORACLE_USER }}
          SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_HOST" && test -n "$SSH_USER" && test -n "$SSH_KEY"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/repair_key && chmod 600 ~/.ssh/repair_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/repair_key -o IdentitiesOnly=yes "$SSH_USER@$SSH_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /home/ubuntu/chzzk-bot
          .venv/bin/python - <<'PY'
          import guild_server_banner as g
          old='https://x.com/ROFAN_reader_/status/2112566920054800392'
          state=g.read_state()
          pool=g.approved_hanayo_art()+g.collected_hanayo_art()
          current=state.get('post_url','')
          print('CURRENT_BANNER',current)
          print('ELIGIBLE_CANDIDATES',len(pool))
          assert pool, 'No safely screened Hiyori candidate; no change'
          assert all(i.get('post_url')!=old for _,i in pool), 'Reported ineligible banner still in pool'
          if current!=old:
              print('ALREADY_REPLACED_NO_ACTION')
              raise SystemExit(0)
          PY
          if [ "$( .venv/bin/python -c 'import guild_server_banner as g; print(g.read_state().get("post_url",""))' )" = "https://x.com/ROFAN_reader_/status/2112566920054800392" ]; then
            sudo systemd-run --unit=abyss-banner-repair-20261108 --wait --collect \
              --property=User=ubuntu --property=Group=ubuntu \
              --property=WorkingDirectory=/home/ubuntu/chzzk-bot \
              --property=EnvironmentFile=/home/ubuntu/chzzk-bot/.guild_banner_auth.env \
              /usr/bin/flock -n /home/ubuntu/chzzk-bot/creator_media/guild_banner_rotation.lock \
              /home/ubuntu/chzzk-bot/.venv/bin/python -c 'import guild_server_banner as g; r=g.rotate_once(manual=True); print("ONE_TIME_RESULT",r.get("status"),r.get("post_url")); assert r.get("status")=="changed",r' || { sudo journalctl -u abyss-banner-repair-20261108.service -n 25 --no-pager -o cat; exit 1; }
          fi
          .venv/bin/python - <<'PY'
          import guild_server_banner as g
          state=g.read_state()
          print('POST_REPAIR_SOURCE',state.get('post_url'))
          print('POST_REPAIR_ARTIST',state.get('artist'))
          assert state.get('post_url')!='https://x.com/ROFAN_reader_/status/2112566920054800392'
          PY
          REMOTE
