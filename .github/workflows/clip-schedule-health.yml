name: "커뮤니티 · 정보 패널 상태 점검"
on:
  schedule:
    # Read-only check every hour; dashboard refreshes at least hourly.
    - cron: '25 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: abyss-community-dashboard-health
  cancel-in-progress: false

jobs:
  check:
    if: github.repository == '114130lena/abyss-bot'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Connect to the existing Ubuntu bot server
        env:
          SSH_HOST: ${{ secrets.ORACLE_HOST }}
          SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/clip_health_key
          chmod 600 ~/.ssh/clip_health_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Verify original community dashboard, open issue only on failure
        env:
          SSH_HOST: ${{ secrets.ORACLE_HOST }}
          SSH_USER: ${{ secrets.ORACLE_USER }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          report="$(mktemp)"
          title="[community-dashboard] Discord information panel health check failed"
          if ssh -i ~/.ssh/clip_health_key -o IdentitiesOnly=yes "$SSH_USER@$SSH_HOST" \
              'cd /home/ubuntu/chzzk-bot && if [ -x .venv/bin/python ]; then PY=.venv/bin/python; else PY=.venv-test/bin/python; fi; "$PY" -c '\''import json, os; from datetime import datetime; from dotenv import load_dotenv; from clip_healthcheck import check_dashboard, KST; load_dotenv("/home/ubuntu/chzzk-bot/.env", override=True); result = check_dashboard(datetime.now(KST)) if os.getenv("CHZZK_CLIP_ENABLED") == "0" else {"status":"clip_not_disabled"}; print("COMMUNITY_DASHBOARD_HEALTH " + json.dumps(result, ensure_ascii=False)); raise SystemExit(0 if result["status"] == "ok" else 1)'\''' > "$report" 2>&1; then
            cat "$report"
            existing="$(gh issue list --repo "$REPO" --state open --limit 100 --json title,number \
              --jq '.[] | select(.title == "[community-dashboard] Discord information panel health check failed") | .number' | head -n 1)"
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --repo "$REPO" --body "Community information panel recovered: verified original message and freshness in Actions run $GITHUB_RUN_ID."
              gh issue close "$existing" --repo "$REPO"
            fi
            echo "COMMUNITY_DASHBOARD_HEALTH=ok"
            exit 0
          fi
          cat "$report"
          existing="$(gh issue list --repo "$REPO" --state open --limit 100 --json title,number \
              --jq '.[] | select(.title == "[community-dashboard] Discord information panel health check failed") | .number' | head -n 1)"
          if [ -z "$existing" ]; then
            gh issue create --repo "$REPO" --title "$title" \
              --body "The community information panel could not be verified as recently updated (75-minute tolerance). The normal notification service was left running. Logs: https://github.com/$REPO/actions/runs/$GITHUB_RUN_ID"
          else
            echo "CHZZK_CLIP_PUBLISH_HEALTH existing_issue=$existing"
          fi
          exit 1
