name: X notification regression tests
on:
  pull_request:
    paths:
      - 'x_post_media.py'
      - 'resilience.py'
      - 'tests/test_x_fast_delivery.py'
      - '.github/workflows/x-delivery-tests.yml'
  push:
    branches:
      - 'fix/x-fast-discord-delivery-20261105'
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_x_fast_delivery.py' -v
