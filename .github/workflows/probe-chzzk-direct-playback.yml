name: Verify direct CHZZK clip playback metadata
# Verify CHZZK content flags against valid MP4 access; redact signed URLs
on:
  push:
    branches: [feature/chzzk-clips-platform-probe]
    paths: [.github/workflows/probe-chzzk-direct-playback.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/chzzk-clips-platform-probe
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - run: python scripts/probe_chzzk_direct_playback.py
