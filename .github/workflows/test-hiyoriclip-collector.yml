name: Validate Hiyori X clip collection without Discord publishing
on:
  push:
    branches: [feature/hiyoriclip-daily-recommendation]
    paths: [.github/workflows/test-hiyoriclip-collector.yml]
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/hiyoriclip-daily-recommendation
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'requests>=2.30,<3'
      - name: Offline safe metadata collector unit tests
        run: |
          python -m py_compile hiyoriclip_collector.py
          python -m unittest -v test_hiyoriclip_collector.py
      - name: Probe a previously provided public X account and URL
        env:
          X_BEARER_TOKEN: ''
        run: |
          mkdir -p /tmp/abyss_hiyoriclip_test/creator_media
          printf '33ammi\n' > /tmp/abyss_hiyoriclip_test/creator_media/hiyoriclip_accounts.txt
          printf 'https://x.com/33ammi/status/2116841881615446466\n' > /tmp/abyss_hiyoriclip_test/creator_media/hiyoriclip_post_urls.txt
          BOT_DATA_DIR=/tmp/abyss_hiyoriclip_test python -u hiyoriclip_collector.py
          BOT_DATA_DIR=/tmp/abyss_hiyoriclip_test python -u hiyoriclip_collector.py --show
