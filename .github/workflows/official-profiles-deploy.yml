name: Deploy independent official profile refresh
on:
  issues:
    types: [opened]
permissions:
  contents: read
  issues: read
jobs:
  deploy:
    if: false # Retired one-off deployment; only deploy.yml may update live code
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/compact-footer-four-links
          persist-credentials: false
      - run: python -m py_compile collect_official_profiles.py random_media.py
      - name: Install independent profile timer and verify official candidate pool
        env:
          SSH_HOST: ${{ secrets.ORACLE_HOST }}
          SSH_USER: ${{ secrets.ORACLE_USER }}
          SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/profile_key
          chmod 600 ~/.ssh/profile_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          for f in collect_official_profiles.py random_media.py; do
            scp -i ~/.ssh/profile_key -o IdentitiesOnly=yes "$f" "$SSH_USER@$SSH_HOST:/tmp/abyss_profile_$f"
          done
          ssh -i ~/.ssh/profile_key -o IdentitiesOnly=yes "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /home/ubuntu/chzzk-bot
          mkdir -p backups/official-profiles
          cp random_media.py backups/official-profiles/random_media.py
          cp /tmp/abyss_profile_random_media.py random_media.py
          cp /tmp/abyss_profile_collect_official_profiles.py collect_official_profiles.py
          if [ -x .venv/bin/python ]; then PY=.venv/bin/python; else PY=.venv-test/bin/python; fi
          "$PY" -m py_compile random_media.py collect_official_profiles.py
          "$PY" collect_official_profiles.py
          cat >/tmp/abyss-official-profiles.service <<EOF
          [Unit]
          Description=Refresh Abyss official creator profile photos
          [Service]
          Type=oneshot
          User=$(whoami)
          WorkingDirectory=/home/ubuntu/chzzk-bot
          ExecStart=/home/ubuntu/chzzk-bot/$PY collect_official_profiles.py
          TimeoutStartSec=180
          EOF
          cat >/tmp/abyss-official-profiles.timer <<'EOF'
          [Unit]
          Description=Refresh official profiles every six hours
          [Timer]
          OnCalendar=*-*-* 03,09,15,21:00:00
          RandomizedDelaySec=120
          Persistent=true
          Unit=abyss-official-profiles.service
          [Install]
          WantedBy=timers.target
          EOF
          sudo install -m 644 /tmp/abyss-official-profiles.service /etc/systemd/system/
          sudo install -m 644 /tmp/abyss-official-profiles.timer /etc/systemd/system/
          sudo systemctl daemon-reload
          sudo systemctl enable --now abyss-official-profiles.timer
          sudo systemctl is-active --quiet abyss-official-profiles.timer
          sudo systemctl restart chzzk-bot.service
          sudo systemctl is-active --quiet chzzk-bot.service
          "$PY" - <<'PY'
          from random_media import _local_candidates
          from collect_creator_media import read_index
          data=read_index()
          for group in ('hanayo','sakihane'):
              pool=_local_candidates(group,'profile')
              assert pool,(group,'empty profile')
              print('OFFICIAL_PROFILE_POOL',group,len(pool),
                   sorted({i.get('source') for i in data.get(group,{}).get('profile',[])}))
              assert all('fanart' not in str(p[0]) for p in pool)
          PY
          echo OFFICIAL_PROFILE_DEPLOY_SUCCESS
          REMOTE
