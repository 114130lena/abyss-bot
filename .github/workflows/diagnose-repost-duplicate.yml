name: Read-only X repost duplicate incident evidence
on:
  pull_request:
    paths: ['.github/workflows/diagnose-repost-duplicate.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Extract redacted repost ledger, processes and delivery status
        env:
          SSH_HOST: ${{ secrets.ORACLE_HOST }}
          SSH_USER: ${{ secrets.ORACLE_USER }}
          SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/dup_key
          chmod 600 ~/.ssh/dup_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          timeout 120s ssh -o ConnectTimeout=12 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -i ~/.ssh/dup_key -o IdentitiesOnly=yes "$SSH_USER@$SSH_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /home/ubuntu/chzzk-bot
          echo "== X workers service and process counts =="
          systemctl show chzzk-bot.service -p ActiveState -p MainPID -p NRestarts --no-pager || true
          ps -eo args | grep -E '[p]ython.*(main.py|twitter_notifier|x_repost)' | sed -E 's#(https?://)[^ ]+#\1[REDACTED]#g' | cut -c 1-180 | sort | uniq -c | head -20 || true
          echo "== Repost deliveries 19:35..19:58 KST (timestamps + source post ID only) =="
          journalctl -u chzzk-bot.service --since '2026-11-09 10:35:00 UTC' --until '2026-11-09 10:58:00 UTC' -o short-iso --utc --no-pager 2>/dev/null | grep -E 'X_REPOST_DISCOVERED|X_REPOST_DELIVERED|X_REPOST_TOTAL|X_FX_REPOST_SCAN|DISCORD_WEBHOOK_DELIVERED|DISCORD_DELIVERY_REVIEW_PENDING|X RSS .*재시도|X RSS.*실패|후야 X RSS.*실패|X_REPOST_MEDIA_RESOLVED' | sed -E 's#(https?://)[^ ]+#\1[REDACTED]#g' | tail -100 || true
          echo "== persisted seen state counts and relevant modification times =="
          if [ -x .venv/bin/python ]; then PY=.venv/bin/python; else PY=.venv-test/bin/python; fi
          "$PY" - <<'PY'
          import json,os
          from pathlib import Path
          names=['x_seen_posts.json','x_repost_seen_posts.json','x_huya_seen_posts.json','x_huya_repost_seen_posts.json','x_fx_timeline_hanayohiyori.json','x_fx_timeline_sakihanehuya.json','discord_delivery_uncertain.jsonl']
          for name in names:
              p=Path(name)
              if not p.exists():
                  print('LEDGER',name,'missing');continue
              try:
                  if name.endswith('.jsonl'):
                      count=sum(1 for line in p.open(encoding='utf-8') if line.strip())
                  else:
                      j=json.loads(p.read_text(encoding='utf-8'))
                      count=len(j) if isinstance(j,(list,dict)) else -1
                  print('LEDGER',name,'items',count,'size',p.stat().st_size,'modified_epoch',int(p.stat().st_mtime))
              except (OSError,ValueError) as ex: print('LEDGER',name,type(ex).__name__)
          PY
          echo "== Exact webhook messages using their original webhook ownership =="
          "$PY" - <<'PY'
          import os, json, hashlib, re, requests
          from urllib.parse import urlsplit
          from dotenv import load_dotenv
          load_dotenv(".env")
          target_webhook="1563895508819382352"
          ids=["1569300884662521889","1569303241404059829"]
          candidates=["DISCORD_WEBHOOK_URL","X_REPOST_WEBHOOK_URL","HANAYO_WEBHOOK_URL"]
          matching=[]
          for name in candidates:
              raw=os.getenv(name,"")
              p=urlsplit(raw)
              parts=p.path.strip("/").split("/")
              if p.hostname in ("discord.com","discordapp.com") and len(parts)>=4 and parts[-2]==target_webhook:
                  matching.append((name,"https://discord.com/api/v10/webhooks/"+parts[-2]+"/"+parts[-1]))
          print("WEBHOOK_KEYS_MATCHING", [x[0] for x in matching])
          if not matching:
              raise SystemExit(0)
          hook=matching[0][1]
          def extract(parts):
              result=[]
              for item in parts or []:
                  if not isinstance(item,dict): continue
                  if item.get("type")==10: result.append(str(item.get("content") or ""))
                  result.extend(extract(item.get("components") or []))
              return result
          bodies={}
          for msgid in ids:
              try:
                  r=requests.get(hook+"/messages/"+msgid,params={"thread_id":"1566509366591627344","with_components":"true"},timeout=12)
                  print("WEBHOOK_MESSAGE_HTTP",msgid,r.status_code)
                  if r.status_code!=200:continue
                  m=r.json()
                  full="\n".join(extract(m.get("components")) + [m.get("content") or ""])
                  bodies[msgid]=full
                  xlinks=re.findall(r'https?://(?:x\\.com|twitter\\.com|fxtwitter\\.com)/[A-Za-z0-9_]+/status/[0-9]+',full)
                  print("WEBHOOK_MESSAGE",json.dumps({"id":msgid,"components":len(m.get("components") or []),"hash":hashlib.sha256(full.encode()).hexdigest()[:16],"extracted_status_urls":xlinks[:6],"text_length":len(full),"attachments":len(m.get("attachments") or []),"edited":m.get("edited_timestamp")},ensure_ascii=False))
              except (requests.RequestException,ValueError,TypeError) as ex:print("WEBHOOK_MESSAGE_ERROR",msgid,type(ex).__name__)
          if len(bodies)==2:
              import difflib
              a,b=(bodies[msgid] for msgid in ids)
              print("WEBHOOK_COMPARE",json.dumps({"same":a==b,"similarity":round(difflib.SequenceMatcher(None,a,b).ratio(),3),"before_excerpt":a[:450],"after_excerpt":b[:450]},ensure_ascii=False))
          PY
          echo "== Deployed original-repost dedup revision check =="
          if [ -f .deployed_revision ]; then printf 'DEPLOYED_REVISION='; cat .deployed_revision; fi
          test -f x_repost_delivery_ledger.py
          "$PY" -B - <<'PY'
          from x_repost_delivery_ledger import fingerprint
          a={"id":"2119742014694769083","text":"RT @mttpape: 스텔라이브 소속 하나요 히요리 님의 데뷔 커버곡 유령이 되고 싶어 (ゆうれいになりたい) 일러스트를 담당했습니다.\n\n데뷔 축하드려요~!👻","url":"https://x.com/HanayoHiyori/status/2119742014694769083"}
          b={"id":"2111459758842789889","text":"스텔라이브 소속 하나요 히요리 님의 데뷔 커버곡 유령이 되고 싶어 (ゆうれいになりたい) 일러스트를 담당했습니다.\n\n데뷔 축하드려요~!👻\nThis post is unavailable","url":"https://x.com/mttpape/status/2111459758842789889"}
          result=(fingerprint("hanayo",a) == fingerprint("hanayo",b))
          print("LIVE_DEDUP_MODULE_PRESENT=True")
          print("LIVE_PAIR_MATCHES=",result)
          assert result
          PY
          REMOTE
