name: Banner information synchronization tests

on:
  pull_request:
    paths:
      - 'guild_server_banner.py'
      - 'tests/test_banner_info_sync.py'
      - '.github/workflows/banner-info-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  banner-info:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile guild_server_banner.py
      - run: python -m unittest discover -s tests -p 'test_banner_info_sync.py' -v
