name: Inspect X resolver deadlines and original photo guards
on:
  push:
    branches: [feature/chzzk-clips-platform-probe]
    paths: [.github/workflows/inspect-x-media-resolver.yml]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: SSH
        env:
          HOST: ${{ secrets.ORACLE_HOST }}
          KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/key && chmod 600 ~/.ssh/key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
      - name: Inspect resolver source
        env:
          HOST: ${{ secrets.ORACLE_HOST }}
          USER: ${{ secrets.ORACLE_USER }}
        run: |
          ssh -i ~/.ssh/key -o IdentitiesOnly=yes "$USER@$HOST" 'bash -se' <<'REMOTE'
          cd /home/ubuntu/chzzk-bot
          python3 - <<'PY'
          from pathlib import Path
          p=Path('x_post_media.py')
          lines=p.read_text().splitlines()
          print('RESOLVER_START',len(lines))
          for i,line in enumerate(lines[:235],1):print(f'{i:03} {line}')
          print('RESOLVER_END')
          PY
          REMOTE
