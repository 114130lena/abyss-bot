name: Mark recovered 08 KST banner slot complete
on:
  push:
    branches: [feature/hanayo-approved-fanart-server-banner]
    paths: [.github/workflows/normalize-recovered-morning-slot.yml]
permissions:
  contents: read
jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: SSH setup
        env:
          SSH_HOST: ${{ secrets.ORACLE_HOST }}
          SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_HOST" && test -n "$SSH_KEY"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
      - name: Safely mark the recovered morning banner as already rotated
        env:
          SSH_HOST: ${{ secrets.ORACLE_HOST }}
          SSH_USER: ${{ secrets.ORACLE_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/oracle_key -o IdentitiesOnly=yes "$SSH_USER@$SSH_HOST" 'cd /home/ubuntu/chzzk-bot && if [ -x .venv/bin/python ]; then PY=.venv/bin/python; else PY=.venv-test/bin/python; fi; "$PY" -' <<'PY'
          from guild_server_banner import read_state, write_state
          state=read_state()
          last=str(state.get("last_slot",""))
          if last.startswith("manual:2026-11-05T08:") and state.get("last_sha256"):
              state["last_slot"]="2026-11-05 08:00"
              write_state(state)
              print("BANNER_RECOVERY_SLOT_NORMALIZED 2026-11-05 08:00")
          elif last=="2026-11-05 08:00":
              print("BANNER_RECOVERY_SLOT_ALREADY_MARKED")
          else:
              print("BANNER_RECOVERY_SLOT_NOT_MATCHING "+last)
              raise SystemExit(1)
          PY
