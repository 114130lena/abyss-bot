name: Read-only CHZZK 227-second live alert trace
# Production fast-path verification after fix PR #259
on:
  pull_request:
    paths: ['.github/workflows/read-only-chzzk-delay-trace.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Trace recent CHZZK alert pipeline without writing
        env:
          SSH_HOST: ${{ secrets.ORACLE_HOST }}
          SSH_USER: ${{ secrets.ORACLE_USER }}
          SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh; chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          timeout 105s ssh -o ConnectTimeout=12 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -i ~/.ssh/key -o IdentitiesOnly=yes "$SSH_USER@$SSH_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /home/ubuntu/chzzk-bot
          echo "=== Confirm deployed revision and live process ==="
          if [ -f .deployed_revision ]; then printf 'DEPLOYED_REVISION='; cat .deployed_revision; fi
          systemctl show chzzk-bot.service -p ActiveState -p MainPID --no-pager || true
          echo "=== CHZZK exact alert trace 2026-11-09 21:28 - 21:36 KST ==="
          journalctl -u chzzk-bot.service --since '2026-11-09 12:28:00 UTC' --until '2026-11-09 12:36:00 UTC' -o short-iso --utc --no-pager | grep -Ei 'CHZZK|치지직|DISCORD_|X_MEDIA_DOWNLOAD|FANART_|랜덤|profile|banner|서버 배너|status|OPEN|attachment|upload' | sed -E 's#https?://[^ ]+#[URL]#g' | cut -c1-320 | tail -95 || true
          echo "=== Send-start to fanart selection, 21:30:30 - 21:34:50 KST ==="
          journalctl -u chzzk-bot.service --since '2026-11-09 12:30:30 UTC' --until '2026-11-09 12:34:50 UTC' -o short-iso --utc --no-pager | grep -Ei 'CHZZK|치지직|DISCORD|FANART|X_MEDIA|media|이미지|랜덤|ERROR|WARNING|bot.service' | sed -E 's#https?://[^ ]+#[URL]#g' | cut -c1-340 | tail -85 || true
          echo "=== CHZZK previous alert trace 2026-11-09 18:00 - 18:35 KST ==="
          journalctl -u chzzk-bot.service --since '2026-11-09 09:30:00 UTC' --until '2026-11-09 09:34:00 UTC' -o short-iso --utc --no-pager | grep -Ei 'CHZZK|치지직|DISCORD_|X_MEDIA_DOWNLOAD|FANART_|랜덤|profile|banner' | sed -E 's#https?://[^ ]+#[URL]#g' | cut -c1-320 | tail -55 || true
          echo "=== Config feature flags and media pool sizes ==="
          if [ -x .venv/bin/python ]; then PY=.venv/bin/python; else PY=python3; fi
          "$PY" - <<'PY'
          import os,json
          from pathlib import Path
          from dotenv import load_dotenv
          load_dotenv('.env')
          for key in ('ABYSS_RANDOM_MEDIA','ABYSS_NOTIFICATION_FANART','ABYSS_FANART_URLS','CHZZK_THUMBNAIL_ENABLED','POLL_INTERVAL'):
              print('FLAG',key,os.getenv(key,'(default)'))
          for path in ('creator_media/index.json','creator_media/fanart_discovery.json','creator_media/fanart_notification_history.json'):
              p=Path(path)
              print('FILE',path,'size_bytes',p.stat().st_size if p.exists() else None)
          PY
          echo "=== Live fast-path selection microbenchmark: NO Discord delivery ==="
          "$PY" - <<'PY'
          import time,os
          from pathlib import Path
          from dotenv import load_dotenv
          load_dotenv('.env')
          from fanart_usage import server_reserved_post_ids
          from fanart_url_media import candidates
          from discord_v2 import alert
          from random_media import prepare_payload
          from fanart_url_media import apply
          for group in ('hanayo','sakihane'):
              for label,call in (
                  ('reserve_ids',lambda:server_reserved_post_ids(group)),
                  ('notification_candidates',lambda:candidates(group))):
                  started=time.monotonic()
                  value=call()
                  print('MICROBENCH',group,label,'seconds',round(time.monotonic()-started,3),
                        'count',len(value))
          payload=alert('chzzk','하나요 히요리','https://example.org/banner.jpg',
                        title='Read-only performance test',url='https://chzzk.naver.com/live/test',
                        avatar='https://example.org/avatar.jpg',ping=False)
          begin=time.monotonic()
          candidate,chosen=prepare_payload(payload)
          print('MICROBENCH','chzzk','profile_and_banner_pick','seconds',round(time.monotonic()-begin,3),'chosen',bool(chosen))
          begin=time.monotonic()
          decorated,selection=apply(candidate)
          print('MICROBENCH','chzzk','fanart_decoration','seconds',round(time.monotonic()-begin,3),'selected',bool(selection))
          PY
          REMOTE
