name: Abyss X media regression

on:
  pull_request:
    paths:
      - 'x_post_media.py'
      - 'twitter_notifier.py'
      - 'twitter_huya_notifier.py'
      - 'discord_v2.py'
      - 'tests/test_x_post_media.py'
      - '.github/workflows/x-media-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  x-media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m py_compile x_post_media.py twitter_notifier.py twitter_huya_notifier.py discord_v2.py
      - run: python -m unittest discover -s tests -p 'test_x_post_media.py' -v
