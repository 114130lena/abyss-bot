name: Fanart URL-only Discord preview
on:
  issues:
    types: [opened]
permissions:
  contents: read
  issues: read
jobs:
  preview:
    if: ${{ github.event.issue.title == '[abyss-test] fanart-url-preview' && github.event.issue.user.login == github.repository_owner }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/compact-footer-four-links
          persist-credentials: false
      - name: Preview original image URLs only, never publish to production
        env:
          SSH_HOST: ${{ secrets.ORACLE_HOST }}
          SSH_USER: ${{ secrets.ORACLE_USER }}
          SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/fanart_url_key
          chmod 600 ~/.ssh/fanart_url_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          scp -i ~/.ssh/fanart_url_key -o IdentitiesOnly=yes fanart_url_media.py "$SSH_USER@$SSH_HOST:/tmp/abyss_preview_fanart_url_media.py"
          ssh -i ~/.ssh/fanart_url_key -o IdentitiesOnly=yes "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /home/ubuntu/chzzk-bot
          if [ -x .venv/bin/python ]; then PY=.venv/bin/python; else PY=.venv-test/bin/python; fi
          "$PY" - <<'PY'
          import os,json,random,requests
          from urllib.parse import urlsplit,urlunsplit,parse_qsl,urlencode
          from dotenv import load_dotenv
          load_dotenv('.env')
          from fanart_discovery import read,QUEUE
          from discord_v2 import alert
          from banner_manager import get_banner
          from creator_profiles import avatar,handle
          from resilience import send_webhook
          base=os.getenv('TEST_DISCORD_WEBHOOK_URL') or os.getenv('DISCORD_WEBHOOK_URL','')
          assert base.startswith('https://'), 'Missing webhook'
          p=urlsplit(base)
          q=dict(parse_qsl(p.query,keep_blank_values=True))
          q['thread_id']='1566335914500816988'
          dest=urlunsplit((p.scheme,p.netloc,p.path,urlencode(q),p.fragment))
          import importlib.util
          spec=importlib.util.spec_from_file_location('fanart_url_preview','/tmp/abyss_preview_fanart_url_media.py')
          mod=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          for group,name in [('hanayo','하나요 히요리'),('sakihane','사키하네 후야')]:
              payload=alert('x',name,banner=get_banner(group),role_id='',
                  title='[테스트] 팬아트 원본 버튼 · '+name,
                  body='원본 링크를 본문 대신 하단 첫 번째 버튼으로 표시합니다.',
                  url='https://x.com/'+('HanayoHiyori' if group=='hanayo' else 'SakihaneHuya'),
                  avatar=avatar(group),handle=handle(group),ping=False)
              # X and Cafe posts with native attached photos must not add fanart.
              for platform in ('x','cafe'):
                  with_photo=alert(platform,name,banner=get_banner(group),role_id='',
                      title='[테스트] 게시글 자체 이미지',body='게시글 이미지가 우선입니다.',
                      url='https://x.com/'+('HanayoHiyori' if group=='hanayo' else 'SakihaneHuya'),
                      avatar=avatar(group),handle=handle(group),ping=False,
                      images=['https://pbs.twimg.com/media/test.jpg'])
                  unchanged,art=mod.apply(with_photo,group)
                  assert art is None and unchanged==with_photo, (group,platform)
                  print('FANART_SUPPRESSED_FOR_POST_PHOTO',group,platform,flush=True)
              # A YouTube thumbnail does not suppress artist media.
              youtube=alert('youtube',name,banner=get_banner(group),role_id='',
                  title='[테스트] 유튜브 영상 썸네일',url='https://www.youtube.com/',
                  images=['https://i.ytimg.com/vi/example/hqdefault.jpg'],
                  avatar=avatar(group),handle=handle(group),ping=False)
              assert mod.has_post_photos(youtube) is False
              # CHZZK live and replay are also eligible for fanart.
              for replay in (False,True):
                  chzzk=alert('chzzk',name,banner=get_banner(group),role_id='',
                      title='[테스트] 치지직',url='https://chzzk.naver.com/',
                      avatar=avatar(group),handle=handle(group),ping=False,replay=replay)
                  assert mod.has_post_photos(chzzk) is False
              prepared,selected=mod.apply(payload,group)
              assert selected, 'No URL-based art available'
              parts=prepared['components'][-1]['components']
              row=next(x for x in parts if x.get('type')==1)
              assert row['components'][0]['label']=='원본 게시물'
              assert len(row['components'])<=5
              assert '원본 게시물](' not in json.dumps(prepared,ensure_ascii=False)
              prepared['allowed_mentions']={'parse':[]}
              send_webhook(dest,prepared,attempts=1)
              print('FANART_BUTTON_TEST_SENT',group,selected['banner'][2],
                    'buttons',[x['label'] for x in row['components']],flush=True)
          PY
          REMOTE
