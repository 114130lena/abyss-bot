name: One-time guild icon 3-minute restore test
on:
  push:
    branches: [feature/hanayo-approved-fanart-server-banner]
    paths: [.github/workflows/guild-icon-three-minute-test.yml]
permissions:
  contents: read
concurrency:
  group: abyss-guild-banner-update
  cancel-in-progress: false
jobs:
  temporary-icon-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image tools
        run: python -m pip install 'Pillow>=10,<13' 'requests>=2.30,<3'
      - name: Connect to backup host
        env:
          SSH_HOST: ${{ secrets.ORACLE_HOST }}
          SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_HOST" && test -n "$SSH_KEY"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
      - name: Change icon for 180 seconds then restore existing icon
        env:
          SSH_HOST: ${{ secrets.ORACLE_HOST }}
          SSH_USER: ${{ secrets.ORACLE_USER }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
        run: python -u scripts/guild_icon_three_minute_test.py
