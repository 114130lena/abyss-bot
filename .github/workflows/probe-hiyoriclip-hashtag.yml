name: Probe hiyoriclip hashtag search API without publishing
# Distinguish empty hashtag from unavailable API using control queries.
on:
  push:
    branches: [feature/hiyoriclip-daily-recommendation]
    paths: [.github/workflows/probe-hiyoriclip-hashtag.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/hiyoriclip-daily-recommendation
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'requests>=2.30,<3'
      - name: Check latest hashtag video results and public engagement fields
        run: python -u scripts/probe_hiyoriclip_search.py
