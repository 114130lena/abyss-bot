name: Abyss Discord preview via approved issue

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: read

jobs:
  preview:
    if: ${{ github.event.issue.title == '[abyss-test] hanayo' || github.event.issue.title == '[abyss-test] sakihane' }}
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Check owner-only request
        env:
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          test "$ISSUE_AUTHOR" = "$REPO_OWNER"
      - name: Checkout isolated preview branch
        uses: actions/checkout@v4
        with:
          ref: test/compact-footer-four-links
          persist-credentials: false
      - name: Compile preview layout
        run: python -m py_compile discord_v2.py random_media.py
      - name: Connect to existing bot server
        env:
          SSH_HOST: ${{ secrets.ORACLE_HOST }}
          SSH_USER: ${{ secrets.ORACLE_USER }}
          SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -eu
          test -n "$SSH_HOST" && test -n "$SSH_USER" && test -n "$SSH_KEY"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/abyss_test_key
          chmod 600 ~/.ssh/abyss_test_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          scp -i ~/.ssh/abyss_test_key -o IdentitiesOnly=yes discord_v2.py "$SSH_USER@$SSH_HOST:/tmp/abyss_preview_discord_v2.py"
          scp -i ~/.ssh/abyss_test_key -o IdentitiesOnly=yes random_media.py "$SSH_USER@$SSH_HOST:/tmp/random_media.py"
      - name: Send native Section preview to pinned thread
        env:
          SSH_HOST: ${{ secrets.ORACLE_HOST }}
          SSH_USER: ${{ secrets.ORACLE_USER }}
          STREAMER: ${{ github.event.issue.title }}
        run: |
          ssh -i ~/.ssh/abyss_test_key -o IdentitiesOnly=yes "$SSH_USER@$SSH_HOST" "STREAMER='$STREAMER' bash -s" <<'REMOTE'
          set -eu
          cd /home/ubuntu/chzzk-bot
          if [ -x .venv/bin/python ]; then PY=.venv/bin/python; else PY=.venv-test/bin/python; fi
          "$PY" - <<'PY'
          import os,sys,importlib.util,json
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from dotenv import load_dotenv
          from urllib.parse import urlsplit,urlunsplit,parse_qsl,urlencode
          import requests
          sys.path.insert(0,'/home/ubuntu/chzzk-bot')
          load_dotenv('/home/ubuntu/chzzk-bot/.env')
          from banner_manager import get_banner
          from creator_profiles import handle,avatar
          group=os.environ['STREAMER'].rsplit(' ',1)[-1]
          assert group in ('hanayo','sakihane')
          creator='하나요 히요리' if group=='hanayo' else '사키하네 후야'
          sys.path.insert(0,'/tmp')
          os.environ['ABYSS_RANDOM_MEDIA']='1'
          spec=importlib.util.spec_from_file_location('preview_module','/tmp/abyss_preview_discord_v2.py')
          mod=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          # Resolve the monitored CHZZK channel from the existing server config.
          from pathlib import Path
          from creator_groups import chzzk_group
          channel_path=Path('/home/ubuntu/chzzk-bot/channels.txt')
          if channel_path.is_file():
              for raw in channel_path.read_text().splitlines():
                  cid=raw.strip()
                  if cid and not cid.startswith('#') and chzzk_group(cid)==group:
                      os.environ[group.upper()+'_CHZZK_URL']='https://chzzk.naver.com/'+cid
                      break
          # A generic CHZZK home link is used only in this preview if no creator ID is configured.
          if not os.getenv(group.upper()+'_CHZZK_URL','').startswith('https://'):
              os.environ[group.upper()+'_CHZZK_URL']='https://chzzk.naver.com/'
          # Use the official platform avatar, never the uploaded GitHub banner.
          portrait_data=None
          avatar_url=avatar(group)
          payload=mod.alert('chzzk',creator,get_banner(group),role_id='',
              title='[테스트] 하요링 ~ 오늘은 그녀와 함께' if group=='hanayo' else '[테스트] 후야 방송 시작',
              url='https://chzzk.naver.com/',
              media_url='https://i.ytimg.com/vi/aqz-KE-bpKQ/hqdefault.jpg',
              category='Just Chatting',date=datetime.now(ZoneInfo('Asia/Seoul')).isoformat(),
              ping=False,handle=handle(group),avatar=avatar_url,username='어비스봇 · 테스트')
          parts=payload['components'][-1]['components']
          assert parts[0]['type']==9, 'Top must be native Section with avatar'
          assert parts[0]['accessory']['type']==11, 'Avatar accessory missing'
          if group=='hanayo':
              from random_media import candidates
              assert candidates(group,'banner',get_banner(group)), 'Missing banner candidates'
          assert parts[1]['type']==14, 'Profile divider missing'
          assert not (parts[0]['type']==12), 'Image-card header must be removed'
          assert any(p.get('type')==10 and ' · Just Chatting' in p.get('content','') and p.get('content','').startswith('## [') for p in parts), 'Title/category not inline'
          assert parts[-3].get('type')==10 and 'OFFICIAL LINKS' in parts[-3]['content'], 'Footer signature label missing'
          assert parts[-2].get('type')==12, 'Full-width YouTube banner missing'
          assert parts[-1].get('type')==1, 'Four-link row missing'
          assert [b['label'] for b in parts[-1]['components']]==['CHZZK','CAFE','X','YouTube'], 'Expected four buttons in order'
          payload['allowed_mentions']={'parse':[]}
          hook=os.getenv('TEST_DISCORD_WEBHOOK_URL') or os.getenv('DISCORD_WEBHOOK_URL','')
          assert hook.startswith('https://'), 'Webhook missing'
          u=urlsplit(hook)
          q=dict(parse_qsl(u.query,keep_blank_values=True))
          q.update({'with_components':'true','thread_id':'1566335914500816988','wait':'true'})
          endpoint=urlunsplit((u.scheme,u.netloc,u.path,urlencode(q),u.fragment))
          response=requests.post(endpoint,json=payload,timeout=25)
          if not response.ok: print(response.text[:1000])
          response.raise_for_status()
          data=response.json()
          print('Native Section preview sent:',data.get('id'),'group:',group,'components:',len(parts))
          PY
          REMOTE

  collect_media:
    if: ${{ github.event.issue.title == '[abyss-collect] media' }}
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Owner-only collection request
        env:
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: test "$ISSUE_AUTHOR" = "$REPO_OWNER"
      - name: Checkout collector from isolated test branch
        uses: actions/checkout@v4
        with:
          ref: test/compact-footer-four-links
          persist-credentials: false
      - name: Validate collector syntax
        run: python -m py_compile collect_creator_media.py x_public_media.py
      - name: Run collection on existing host without Discord delivery
        env:
          SSH_HOST: ${{ secrets.ORACLE_HOST }}
          SSH_USER: ${{ secrets.ORACLE_USER }}
          SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -eu
          test -n "$SSH_HOST" && test -n "$SSH_USER" && test -n "$SSH_KEY"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/abyss_collect_key
          chmod 600 ~/.ssh/abyss_collect_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          scp -i ~/.ssh/abyss_collect_key -o IdentitiesOnly=yes collect_creator_media.py "$SSH_USER@$SSH_HOST:/tmp/abyss_collect_creator_media.py"
          scp -i ~/.ssh/abyss_collect_key -o IdentitiesOnly=yes x_public_media.py "$SSH_USER@$SSH_HOST:/tmp/x_public_media.py"
          ssh -i ~/.ssh/abyss_collect_key -o IdentitiesOnly=yes "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -eu
          cd /home/ubuntu/chzzk-bot
          if [ -x .venv/bin/python ]; then PY=.venv/bin/python; else PY=.venv-test/bin/python; fi
          PYTHONPATH=/tmp:/home/ubuntu/chzzk-bot "$PY" /tmp/abyss_collect_creator_media.py
          "$PY" - <<'PY'
          import json
          from pathlib import Path
          path=Path('/home/ubuntu/chzzk-bot/creator_media/index.json')
          info=json.loads(path.read_text())
          for group in ('hanayo','sakihane'):
              for kind in ('profile','banner'):
                  for item in info.get(group,{}).get(kind,[]):
                      print('COLLECTED',group,kind,item.get('source'),item.get('width'),item.get('height'),item.get('original_url'))
          PY
          REMOTE

      - name: Retrieve collected X images for user review
        env:
          SSH_HOST: ${{ secrets.ORACLE_HOST }}
          SSH_USER: ${{ secrets.ORACLE_USER }}
        run: |
          mkdir -p x-media-review
          scp -i ~/.ssh/abyss_collect_key -o IdentitiesOnly=yes -r "$SSH_USER@$SSH_HOST:/home/ubuntu/chzzk-bot/creator_media/" x-media-review/
          python - <<'PY'
          import json,shutil
          from pathlib import Path
          root=Path('x-media-review/creator_media')
          index=json.loads((root/'index.json').read_text())
          out=Path('x-media-review/X-images-only')
          out.mkdir(parents=True,exist_ok=True)
          for group in ('hanayo','sakihane'):
              for kind in ('profile','banner'):
                  for item in index.get(group,{}).get(kind,[]):
                      if item.get('source')!='x': continue
                      source=root/item['path']
                      if not source.is_file(): continue
                      name=group+'_'+kind+source.suffix
                      shutil.copyfile(source,out/name)
                      print('X_IMAGE',name,source.stat().st_size)
          PY
      - name: Package all ten actually collected images
        run: |
          python - <<'PY'
          import json, shutil
          from pathlib import Path
          root=Path('x-media-review/creator_media')
          index=json.loads((root/'index.json').read_text())
          out=Path('x-media-review/all-collected-images')
          for group in ('hanayo','sakihane'):
              for kind in ('profile','banner'):
                  for item in index.get(group,{}).get(kind,[]):
                      path=root/item['path']
                      target=out/group/kind/(item['source']+path.suffix)
                      target.parent.mkdir(parents=True,exist_ok=True)
                      shutil.copyfile(path,target)
                      print('ORIGINAL_IMAGE',target, path.stat().st_size)
          PY
      - name: Attach all collected originals
        uses: actions/upload-artifact@v4
        with:
          name: all-10-original-creator-images
          path: x-media-review/all-collected-images/
          if-no-files-found: error
          retention-days: 14
      - name: Attach collected X images to workflow run
        uses: actions/upload-artifact@v4
        with:
          name: x-public-profile-and-banners
          path: x-media-review/X-images-only/
          if-no-files-found: error
          retention-days: 14

  preview_collected_images:
    if: ${{ github.event.issue.title == '[abyss-preview] collected-images' }}
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Verify repository owner
        env:
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: test "$ISSUE_AUTHOR" = "$REPO_OWNER"
      - name: Open existing server and send four individual image previews
        env:
          SSH_HOST: ${{ secrets.ORACLE_HOST }}
          SSH_USER: ${{ secrets.ORACLE_USER }}
          SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -eu
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/abyss_preview_key
          chmod 600 ~/.ssh/abyss_preview_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/abyss_preview_key -o IdentitiesOnly=yes "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -eu
          cd /home/ubuntu/chzzk-bot
          if [ -x .venv/bin/python ]; then PY=.venv/bin/python; else PY=.venv-test/bin/python; fi
          "$PY" - <<'PY'
          import json,os
          from pathlib import Path
          from urllib.parse import urlsplit,urlunsplit,parse_qsl,urlencode
          from dotenv import load_dotenv
          import requests
          root=Path('/home/ubuntu/chzzk-bot/creator_media')
          index=json.loads((root/'index.json').read_text(encoding='utf-8'))
          load_dotenv('/home/ubuntu/chzzk-bot/.env')
          hook=os.getenv('TEST_DISCORD_WEBHOOK_URL') or os.getenv('DISCORD_WEBHOOK_URL','')
          assert hook.startswith('https://'), 'Missing Discord webhook'
          p=urlsplit(hook)
          q=dict(parse_qsl(p.query,keep_blank_values=True))
          q.update({'thread_id':'1566335914500816988','wait':'true'})
          endpoint=urlunsplit((p.scheme,p.netloc,p.path,urlencode(q),p.fragment))
          for group,display in (('hanayo','하나요 히요리'),('sakihane','사키하네 후야')):
              for kind,caption in (('profile','프로필'),('banner','배너')):
                  candidates=[x for x in index.get(group,{}).get(kind,[]) if x.get('source')=='x']
                  assert candidates, f'No collected X image: {group}/{kind}'
                  item=candidates[-1]
                  file=root/item['path']
                  assert file.is_file() and file.stat().st_size>0
                  filename=f'{group}_{kind}{file.suffix}'
                  payload={'username':'어비스봇 · 이미지 확인',
                    'content':f'**[수집 이미지 테스트] {display} · X {caption}**\\n출처: X 공개 프로필 · {item["width"]}×{item["height"]}',
                    'allowed_mentions':{'parse':[]}}
                  with file.open('rb') as data:
                      response=requests.post(endpoint,
                          data={'payload_json':json.dumps(payload,ensure_ascii=False)},
                          files={'files[0]':(filename,data,'image/jpeg' if file.suffix.lower()=='.jpg' else 'image/png')},timeout=30)
                  if not response.ok: print('Discord error:',response.status_code,response.text[:400])
                  response.raise_for_status()
                  message=response.json()
                  assert message.get('id')
                  print('SENT',group,kind,item.get('source'),item.get('width'),item.get('height'),message['id'])
          PY
          REMOTE

  preview_full_alert_x:
    if: ${{ github.event.issue.title == '[abyss-preview] full-alert-x' }}
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Owner-only
        env:
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: test "$ISSUE_AUTHOR" = "$REPO_OWNER"
      - name: Checkout test layout
        uses: actions/checkout@v4
        with:
          ref: test/compact-footer-four-links
          persist-credentials: false
      - name: Compile
        run: python -m py_compile discord_v2.py
      - name: Preview full live alerts with saved X images
        env:
          SSH_HOST: ${{ secrets.ORACLE_HOST }}
          SSH_USER: ${{ secrets.ORACLE_USER }}
          SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -eu
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/abyss_full_key
          chmod 600 ~/.ssh/abyss_full_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          scp -i ~/.ssh/abyss_full_key -o IdentitiesOnly=yes discord_v2.py "$SSH_USER@$SSH_HOST:/tmp/abyss_full_discord_v2.py"
          ssh -i ~/.ssh/abyss_full_key -o IdentitiesOnly=yes "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -eu
          cd /home/ubuntu/chzzk-bot
          if [ -x .venv/bin/python ]; then PY=.venv/bin/python; else PY=.venv-test/bin/python; fi
          "$PY" - <<'PY'
          import importlib.util,json,os
          from pathlib import Path
          from urllib.parse import urlsplit,urlunsplit,parse_qsl,urlencode
          import requests
          from dotenv import load_dotenv
          load_dotenv('/home/ubuntu/chzzk-bot/.env')
          import sys
          sys.path.insert(0,'/home/ubuntu/chzzk-bot')
          from creator_profiles import handle
          from creator_groups import CHZZK_GROUPS
          spec=importlib.util.spec_from_file_location('layout','/tmp/abyss_full_discord_v2.py')
          mod=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          root=Path('/home/ubuntu/chzzk-bot/creator_media')
          index=json.loads((root/'index.json').read_text(encoding='utf-8'))
          hook=os.getenv('TEST_DISCORD_WEBHOOK_URL') or os.getenv('DISCORD_WEBHOOK_URL','')
          assert hook.startswith('https://')
          u=urlsplit(hook)
          q=dict(parse_qsl(u.query,keep_blank_values=True))
          q.update({'with_components':'true','thread_id':'1566335914500816988','wait':'true'})
          endpoint=urlunsplit((u.scheme,u.netloc,u.path,urlencode(q),u.fragment))
          for group,creator in [('hanayo','하나요 히요리'),('sakihane','사키하네 후야')]:
              selected={}
              for kind in ('profile','banner'):
                  items=[x for x in index.get(group,{}).get(kind,[]) if x.get('source')=='x']
                  assert items,'No saved X '+kind+' for '+group
                  selected[kind]=root/items[-1]['path']
                  assert selected[kind].is_file()
              filename_profile=group+'_profile'+selected['profile'].suffix
              filename_banner=group+'_banner'+selected['banner'].suffix
              cid=next((c for c,g in CHZZK_GROUPS.items() if g==group),'')
              channel=os.getenv(group.upper()+'_CHZZK_URL','').strip() or ('https://chzzk.naver.com/'+cid if cid else 'https://chzzk.naver.com/')
              os.environ[group.upper()+'_CHZZK_URL']=channel
              payload=mod.alert('chzzk',creator,banner='',role_id='',
                  title='[테스트] '+('하요링 ~ 오늘은 그녀와 함께' if group=='hanayo' else '후야의 라이브 방송'),
                  category='Just Chatting',url=channel,
                  media_url='https://i.ytimg.com/vi/aqz-KE-bpKQ/hqdefault.jpg',
                  handle=handle(group),avatar='attachment://'+filename_profile,
                  ping=False,username='어비스봇 · X 이미지 통합 테스트')
              parts=payload['components'][-1]['components']
              assert parts[0]['type']==9 and parts[0]['accessory']['type']==11
              # Footer signature and full-width banner precede the four official links.
              links=parts[-1] if parts[-1].get('type')==1 else None
              assert links and len(links.get('components',[]))==4,'Four link buttons missing'
              parts.insert(len(parts)-1,{'type':12,'items':[{
                  'media':{'url':'attachment://'+filename_banner},
                  'description':creator+' X 공식 헤더'}]})
              parts.insert(len(parts)-2,{'type':10,'content':'-# 공식 채널 · OFFICIAL LINKS · '+('🌸 H I Y O R I' if group=='hanayo' else '💜🐲 H U Y A')})
              parts.insert(len(parts)-3,{'type':14,'divider':True,'spacing':1})
              assert len(parts)<=10,'Discord container limit exceeded'
              payload['allowed_mentions']={'parse':[]}
              with selected['profile'].open('rb') as profile,selected['banner'].open('rb') as banner:
                  files={'files[0]':(filename_profile,profile,'image/jpeg'),
                         'files[1]':(filename_banner,banner,'image/jpeg')}
                  res=requests.post(endpoint,data={'payload_json':json.dumps(payload,ensure_ascii=False)},files=files,timeout=30)
              if not res.ok: print('Discord API error',res.status_code,res.text[:700])
              res.raise_for_status()
              assert res.json().get('id')
              print('FULL_ALERT_SENT',group,res.json()['id'],len(parts),'profile and banner attached')
          PY
          REMOTE

  verify_random_saved_media:
    if: ${{ github.event.issue.title == '[abyss-test] random-archive' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check owner
        env:
          AUTHOR: ${{ github.event.issue.user.login }}
          OWNER: ${{ github.repository_owner }}
        run: test "$AUTHOR" = "$OWNER"
      - uses: actions/checkout@v4
        with:
          ref: test/compact-footer-four-links
          persist-credentials: false
      - run: python -m py_compile random_media.py discord_v2.py resilience.py
      - name: Test actual saved media attachment via isolated modules
        env:
          SSH_HOST: ${{ secrets.ORACLE_HOST }}
          SSH_USER: ${{ secrets.ORACLE_USER }}
          SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -eu
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/abyss_key
          chmod 600 ~/.ssh/abyss_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          for f in random_media.py discord_v2.py resilience.py; do
            scp -i ~/.ssh/abyss_key -o IdentitiesOnly=yes "$f" "$SSH_USER@$SSH_HOST:/tmp/abyss_test_$f"
          done
          ssh -i ~/.ssh/abyss_key -o IdentitiesOnly=yes "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -eu
          cd /home/ubuntu/chzzk-bot
          if [ -x .venv/bin/python ]; then PY=.venv/bin/python; else PY=.venv-test/bin/python; fi
          "$PY" - <<'PY'
          import importlib.util,sys,os
          from urllib.parse import urlsplit,urlunsplit,urlencode,parse_qsl
          from dotenv import load_dotenv
          load_dotenv('/home/ubuntu/chzzk-bot/.env')
          os.environ['ABYSS_RANDOM_MEDIA']='1'
          def load(name):
              spec=importlib.util.spec_from_file_location(name,'/tmp/abyss_test_'+name+'.py')
              mod=importlib.util.module_from_spec(spec)
              sys.modules[name]=mod
              spec.loader.exec_module(mod)
              return mod
          rand=load('random_media')
          res=load('resilience')
          layout=load('discord_v2')
          url=os.getenv('TEST_DISCORD_WEBHOOK_URL') or os.getenv('DISCORD_WEBHOOK_URL','')
          assert url.startswith('https://')
          p=urlsplit(url); q=dict(parse_qsl(p.query,keep_blank_values=True))
          q['thread_id']='1566335914500816988'
          url=urlunsplit((p.scheme,p.netloc,p.path,urlencode(q),p.fragment))
          for group,name in [('hanayo','하나요 히요리'),('sakihane','사키하네 후야')]:
              for repeat in range(2):
                  payload=layout.alert('chzzk',name,
                    banner='https://yt3.googleusercontent.com/something.jpg',
                    role_id='',title='[랜덤 이미지 테스트] '+name,
                    url='https://chzzk.naver.com/',handle='@'+('HanayoHiyori' if group=='hanayo' else 'SakihaneHuya'),
                    avatar='https://yt3.googleusercontent.com/something.jpg',ping=False)
                  prepared,chosen=rand.prepare_payload(payload)
                  assert chosen and all(chosen[1][kind][0].is_file() for kind in ('profile','banner'))
                  assert prepared['components'][-1]['components'][0]['accessory']['media']['url'].startswith('attachment://')
                  print('TEST_PICK',group,repeat,[(k,v[0].name) for k,v in chosen[1].items()])
                  res.send_webhook(url,payload,attempts=1)
          PY
          REMOTE

  deploy_random_media:
