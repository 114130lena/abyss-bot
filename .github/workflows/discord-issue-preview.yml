name: Abyss Discord preview via approved issue

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: read

jobs:
  preview:
    if: ${{ github.event.issue.title == '[abyss-test] hanayo' || github.event.issue.title == '[abyss-test] sakihane' }}
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Check owner-only request
        env:
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          test "$ISSUE_AUTHOR" = "$REPO_OWNER"
      - name: Checkout isolated preview branch
        uses: actions/checkout@v4
        with:
          ref: test/compact-footer-four-links
          persist-credentials: false
      - name: Compile preview layout
        run: python -m py_compile discord_v2.py
      - name: Connect to existing bot server
        env:
          SSH_HOST: ${{ secrets.ORACLE_HOST }}
          SSH_USER: ${{ secrets.ORACLE_USER }}
          SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -eu
          test -n "$SSH_HOST" && test -n "$SSH_USER" && test -n "$SSH_KEY"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/abyss_test_key
          chmod 600 ~/.ssh/abyss_test_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          scp -i ~/.ssh/abyss_test_key -o IdentitiesOnly=yes discord_v2.py "$SSH_USER@$SSH_HOST:/tmp/abyss_preview_discord_v2.py"
      - name: Send one non-pinging preview to pinned thread
        env:
          SSH_HOST: ${{ secrets.ORACLE_HOST }}
          SSH_USER: ${{ secrets.ORACLE_USER }}
          STREAMER: ${{ github.event.issue.title }}
        run: |
          ssh -i ~/.ssh/abyss_test_key -o IdentitiesOnly=yes "$SSH_USER@$SSH_HOST" "STREAMER='$STREAMER' bash -s" <<'REMOTE'
          set -eu
          cd /home/ubuntu/chzzk-bot
          if [ -x .venv/bin/python ]; then PY=.venv/bin/python; else PY=.venv-test/bin/python; fi
          "$PY" - <<'PY'
          import importlib.util, os, sys
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from dotenv import load_dotenv
          sys.path.insert(0, '/home/ubuntu/chzzk-bot')
          load_dotenv('/home/ubuntu/chzzk-bot/.env')
          import requests, io, os
          from PIL import Image
          from test_image_card import send_preview
          url = "https://media.canva.com/v2/image-resize/format:JPG/height:353/quality:75/uri:ifs%3A%2F%2FM%2F05a15de5-968c-4c88-972e-1ae08938b93b/watermark:F/width:1536?csig=AAAAAAAAAAAAAAAAAAAAAPKctX0NMHfCtNhjjUJYN1B6rkGl2QJNgICwZN6toRyW&exp=1793546618&osig=AAAAAAAAAAAAAAAAAAAAAFKrX8SqZ4nJ3LveYfiGbjMM1lDo5c__JY_U3MQPqoup&signer=media-rpc&token=AAIAAU0AJDA1YTE1ZGU1LTk2OGMtNGM4OC05NzJlLTFhZTA4OTM4YjkzYgAAAAABoZe1hJDLPmF7i7STUfT949UU9JvQFLbranoeMUiUoQBvMgSUCw&x-canva-quality=thumbnail"
          resp = requests.get(url,timeout=20)
          print('Canva high-resolution response:',resp.status_code,resp.headers.get('content-type'),len(resp.content))
          resp.raise_for_status()
          im = Image.open(io.BytesIO(resp.content))
          print('Candidate resolution:',im.size)
          if im.size != (1536,353):
              raise RuntimeError('Full resolution not obtained; stop without sending')
          from PIL import Image
          buf = io.BytesIO()
          im.convert('RGB').save(buf,'JPEG',quality=98)
          img=buf.getvalue()
          payload = {'username':'어비스봇 · 원본 화질 테스트','flags':32768,
                     'components':[{'type':17,'accent_color':15177946,'components':[
                       {'type':12,'items':[{'media':{'url':'attachment://abyss_preview.png'},'description':'1536x353 banner'}]}
                     ]}],'allowed_mentions':{'parse':[]}}
          webhook = os.getenv('TEST_DISCORD_WEBHOOK_URL') or os.getenv('DISCORD_WEBHOOK_URL','')
          send_preview(webhook,payload,img)
          print('Full size banner sent.')
          PY
          REMOTE
