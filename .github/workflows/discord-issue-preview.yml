name: Abyss Discord preview via approved issue

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: read

jobs:
  preview:
    if: ${{ github.event.issue.title == '[abyss-test] hanayo' || github.event.issue.title == '[abyss-test] sakihane' }}
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Check owner-only request
        env:
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          test "$ISSUE_AUTHOR" = "$REPO_OWNER"
      - name: Checkout isolated preview branch
        uses: actions/checkout@v4
        with:
          ref: test/compact-footer-four-links
          persist-credentials: false
      - name: Compile preview layout
        run: python -m py_compile discord_v2.py
      - name: Connect to existing bot server
        env:
          SSH_HOST: ${{ secrets.ORACLE_HOST }}
          SSH_USER: ${{ secrets.ORACLE_USER }}
          SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -eu
          test -n "$SSH_HOST" && test -n "$SSH_USER" && test -n "$SSH_KEY"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/abyss_test_key
          chmod 600 ~/.ssh/abyss_test_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          scp -i ~/.ssh/abyss_test_key -o IdentitiesOnly=yes discord_v2.py "$SSH_USER@$SSH_HOST:/tmp/abyss_preview_discord_v2.py"
      - name: Send one non-pinging preview to pinned thread
        env:
          SSH_HOST: ${{ secrets.ORACLE_HOST }}
          SSH_USER: ${{ secrets.ORACLE_USER }}
          STREAMER: ${{ github.event.issue.title }}
        run: |
          ssh -i ~/.ssh/abyss_test_key -o IdentitiesOnly=yes "$SSH_USER@$SSH_HOST" "STREAMER='$STREAMER' bash -s" <<'REMOTE'
          set -eu
          cd /home/ubuntu/chzzk-bot
          if [ -x .venv/bin/python ]; then PY=.venv/bin/python; else PY=.venv-test/bin/python; fi
          "$PY" - <<'PY'
          import importlib.util, os, sys
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from dotenv import load_dotenv
          sys.path.insert(0, '/home/ubuntu/chzzk-bot')
          load_dotenv('/home/ubuntu/chzzk-bot/.env')
          from banner_manager import get_banner
          from creator_profiles import handle, avatar
          from test_image_card import send_preview, card_image
          spec = importlib.util.spec_from_file_location('abyss_preview_layout', '/tmp/abyss_preview_discord_v2.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          group = os.environ['STREAMER'].rsplit(' ', 1)[-1]
          assert group in ('hanayo', 'sakihane')
          creator = '하나요 히요리' if group == 'hanayo' else '사키하네 후야'
          banner = get_banner(group)
          if not banner:
              raise RuntimeError('No cached official banner: refusing incomplete preview')
          payload = module.alert(
              'chzzk', creator, banner, role_id='',
              title='[테스트] 방송 제목 · 카테고리 배치 확인',
              url='https://chzzk.naver.com/',
              media_url='https://i.ytimg.com/vi/aqz-KE-bpKQ/hqdefault.jpg',
              category='Just Chatting', date=datetime.now(ZoneInfo('Asia/Seoul')).isoformat(),
              ping=False, handle=handle(group), avatar=avatar(group),
              username='어비스봇 · 테스트',
          )
          from PIL import Image, ImageDraw, ImageFont
          import io, re
          from test_image_card import _font
          source = Image.open(io.BytesIO(card_image(group))).convert('RGB')
          width, height = 960, 188
          compact = Image.new('RGB', (width, height))
          draw = ImageDraw.Draw(compact)
          start_color = (48, 40, 67) if group == 'sakihane' else (63, 41, 61)
          end_color = (72, 54, 91) if group == 'sakihane' else (97, 57, 86)
          for y in range(height):
              ratio = y / (height - 1)
              color = tuple(round(a * (1-ratio) + b * ratio) for a,b in zip(start_color, end_color))
              draw.line((0,y,width,y), fill=color)
          draw.rounded_rectangle((10, 10, 950, 178), radius=24,
                                 outline=(124, 103, 149), width=3)
          accent = (191, 162, 240) if group == 'sakihane' else (241, 172, 201)
          draw.rounded_rectangle((35, 33, 42, 154), radius=3, fill=accent)
          display = '사키하네 후야' if group == 'sakihane' else '하나요 히요리'
          handle_text = '@SakihaneHuya' if group == 'sakihane' else '@HanayoHiyori'
          name_font = _font(49, bold=True, require_korean=True)
          latin_fallback = 'SAKIHANE HUYA' if group == 'sakihane' else 'HANAYO HIYORI'
          if name_font is None:
              name_font = _font(45, bold=True)
              display = latin_fallback
          draw.text((68, 35), display, font=name_font, fill=(250, 246, 255))
          draw.text((70, 105), handle_text, font=_font(30),
                    fill=(205, 193, 222))
          # Crop only the circular avatar artwork, never the old name/handle.
          portrait = source.crop((730, 31, 924, 225)).resize((146, 146))
          mask = Image.new('L', (146,146), 0)
          ImageDraw.Draw(mask).ellipse((0,0,145,145), fill=255)
          draw.ellipse((768, 19, 934, 185), fill=accent)
          compact.paste(portrait, (778, 29), mask)
          output = io.BytesIO()
          compact.save(output, 'PNG', optimize=True)
          image = output.getvalue()
          assert image.startswith(bytes([137, 80, 78, 71, 13, 10, 26, 10]))
          components = payload['components'][-1]['components']
          # Keep the original YouTube header, but replace the duplicate
          # bottom banner thumbnail with the actual wide PNG profile card.
          footer_index = next(i for i, item in enumerate(components)
                              if item['type'] == 1 and
                              any(b.get('label') == 'YouTube'
                                  for b in item.get('components', [])))
          for i in range(footer_index - 1, -1, -1):
              item = components[i]
              if item['type'] == 9 and item.get('accessory', {}).get('type') == 11:
                  components.pop(i)
                  if i > 0 and components[i-1]['type'] == 14:
                      components.pop(i-1)
                  break
          footer_index = next(i for i, item in enumerate(components) if item['type'] == 1)
          components.insert(footer_index, {'type': 12, 'items': [{
              'media': {'url': 'attachment://abyss_preview.png'},
              'description': '하단 프로필 이미지 카드'
          }]})
          for item in components:
              if item.get('type') == 10:
                  value = item.get('content', '')
                  match = re.fullmatch(r'## \[(.*?) · (.*?)\]\((https://[^)]+)\)', value)
                  if match:
                      item['content'] = '**[' + match.group(1) + '](' + match.group(3) + ')** · ' + match.group(2)
          assert components[0]['type'] == 12, 'Top banner missing'
          assert components[-2]['type'] == 12, 'Bottom image card missing'
          assert components[-1]['type'] == 1, 'Link buttons missing'
          assert len(components[-1]['components']) >= 3
          assert len(components) <= 10, 'V2 component budget exceeded'
          payload['allowed_mentions'] = {'parse': []}
          webhook = os.getenv('TEST_DISCORD_WEBHOOK_URL') or os.getenv('DISCORD_WEBHOOK_URL', '')
          if not webhook:
              raise RuntimeError('No configured Discord webhook')
          send_preview(webhook, payload, image)
          print('PNG image card + both banners sent to fixed thread; mentions disabled.')
          PY
          REMOTE
