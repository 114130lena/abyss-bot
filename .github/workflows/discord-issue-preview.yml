name: Abyss Discord preview via approved issue

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: read

jobs:
  preview:
    if: ${{ github.event.issue.title == '[abyss-test] hanayo' || github.event.issue.title == '[abyss-test] sakihane' }}
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Check owner-only request
        env:
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          test "$ISSUE_AUTHOR" = "$REPO_OWNER"
      - name: Checkout isolated preview branch
        uses: actions/checkout@v4
        with:
          ref: test/compact-footer-four-links
          persist-credentials: false
      - name: Compile preview layout
        run: python -m py_compile discord_v2.py
      - name: Connect to existing bot server
        env:
          SSH_HOST: ${{ secrets.ORACLE_HOST }}
          SSH_USER: ${{ secrets.ORACLE_USER }}
          SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -eu
          test -n "$SSH_HOST" && test -n "$SSH_USER" && test -n "$SSH_KEY"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/abyss_test_key
          chmod 600 ~/.ssh/abyss_test_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          scp -i ~/.ssh/abyss_test_key -o IdentitiesOnly=yes discord_v2.py "$SSH_USER@$SSH_HOST:/tmp/abyss_preview_discord_v2.py"
      - name: Send one non-pinging preview to pinned thread
        env:
          SSH_HOST: ${{ secrets.ORACLE_HOST }}
          SSH_USER: ${{ secrets.ORACLE_USER }}
          STREAMER: ${{ github.event.issue.title }}
        run: |
          ssh -i ~/.ssh/abyss_test_key -o IdentitiesOnly=yes "$SSH_USER@$SSH_HOST" "STREAMER='$STREAMER' bash -s" <<'REMOTE'
          set -eu
          cd /home/ubuntu/chzzk-bot
          if [ -x .venv/bin/python ]; then PY=.venv/bin/python; else PY=.venv-test/bin/python; fi
          "$PY" - <<'PY'
          import importlib.util, os, sys
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from dotenv import load_dotenv
          sys.path.insert(0, '/home/ubuntu/chzzk-bot')
          load_dotenv('/home/ubuntu/chzzk-bot/.env')
          from banner_manager import get_banner
          from creator_profiles import handle, avatar
          from test_image_card import send_preview, card_image
          spec = importlib.util.spec_from_file_location('abyss_preview_layout', '/tmp/abyss_preview_discord_v2.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          group = os.environ['STREAMER'].rsplit(' ', 1)[-1]
          assert group in ('hanayo', 'sakihane')
          creator = '하나요 히요리' if group == 'hanayo' else '사키하네 후야'
          banner = get_banner(group)
          if not banner:
              raise RuntimeError('No cached official banner: refusing incomplete preview')
          payload = module.alert(
              'chzzk', creator, banner, role_id='',
              title='[테스트] 하요링 ~ 오늘은 그녀와 함께',
              url='https://chzzk.naver.com/',
              media_url='https://i.ytimg.com/vi/aqz-KE-bpKQ/hqdefault.jpg',
              category='Just Chatting', date=datetime.now(ZoneInfo('Asia/Seoul')).isoformat(),
              ping=False, handle=handle(group), avatar=avatar(group),
              username='어비스봇 · 테스트',
          )
          import re
          from creator_profiles import avatar as official_avatar
          components = payload['components'][-1]['components']
          # Requested composition: compact image header -> alert -> buttons -> official YouTube banner.
          # Remove original first gallery and the duplicate lower profile thumbnail.
          original_banner = components.pop(0)
          assert original_banner['type'] == 12, 'Original YouTube banner missing'
          components[:] = [item for item in components if not (
              item.get('type') == 9 and item.get('accessory', {}).get('type') == 11
          )]
          # Strip dividers with no meaningful content and ensure footer is clean.
          components[:] = [item for i, item in enumerate(components)
                            if not (item.get('type') == 14 and
                                    (i == 0 or (i+1 < len(components) and
                                     components[i+1].get('type') == 1)))]
          for item in components:
              if item.get('type') == 10:
                  value = item.get('content', '')
                  match = re.fullmatch(r'## \\[(.*?) · (.*?)\\]\\((https://[^)]+)\\)', value)
                  if match:
                      item['content'] = '**[' + match.group(1) + '](' + match.group(3) + ')** · ' + match.group(2)
          # Keep the category adjacent to title, without a repeated time/category footer.
          links_index = next(i for i, item in enumerate(components)
                             if item.get('type') == 1 and
                             any(b.get('label') == 'YouTube'
                                 for b in item.get('components', [])))
          buttons = components[links_index]['components']
          order = {'CHZZK': 0, '스텔라이브 카페': 1, '𝕏': 2, 'YouTube': 3}
          buttons.sort(key=lambda b: order.get(b.get('label'), 9))
          # Resolve the first valid monitored channel for Hanayo where configuration permits.
          if group == 'hanayo' and not any(b.get('label') == 'CHZZK' for b in buttons):
              from pathlib import Path
              channel_file = Path('/home/ubuntu/chzzk-bot/channels.txt')
              channel_ids = [line.strip() for line in channel_file.read_text().splitlines()
                             if line.strip() and not line.startswith('#')] if channel_file.exists() else []
              if channel_ids:
                  buttons.insert(0, {'type': 2, 'style': 5, 'label': 'CHZZK',
                                     'url': 'https://chzzk.naver.com/' + channel_ids[0]})
          # Consistent short labels for mobile; Discord still sizes link buttons automatically.
          for button in buttons:
              if button['label'] == '스텔라이브 카페':
                  button['label'] = 'CAFE'
              elif button['label'] == '𝕏':
                  button['label'] = 'X'
          # Render the slim horizontal image card as one actual PNG.
          from PIL import Image, ImageDraw, ImageFont, ImageOps
          from test_image_card import _font, send_preview
          import requests, io
          profile = Image.new('RGB', (960, 170), (48, 48, 74))
          draw = ImageDraw.Draw(profile)
          # Quiet palette, clean alignment, single subtle separator and no heavy frames.
          accent = (222, 181, 223) if group == 'hanayo' else (185, 170, 225)
          draw.rounded_rectangle((20, 25, 26, 145), radius=3, fill=accent)
          display_name = creator
          display_handle = '@HanayoHiyori' if group == 'hanayo' else '@SakihaneHuya'
          english = '🌸 H I Y O R I' if group == 'hanayo' else '💜 H U Y A'
          name_font = _font(42, bold=True, require_korean=True)
          if not name_font:
              raise RuntimeError('Korean font unavailable for image card')
          draw.text((52, 15), display_name, font=name_font, fill=(255, 255, 255))
          draw.text((54, 80), display_handle, font=_font(25), fill=(216, 215, 230))
          # Decorative flower is drawn separately to prevent unsupported emoji glyphs.
          draw.text((54, 122), english.split(' ', 1)[1], font=_font(22, bold=True),
                    fill=(225, 211, 243))
          avatar_url = official_avatar(group)
          assert avatar_url.startswith('https://'), 'Creator avatar unavailable'
          response = requests.get(avatar_url, timeout=12)
          response.raise_for_status()
          if len(response.content) > 4_000_000:
              raise ValueError('Avatar image too large')
          portrait = ImageOps.fit(Image.open(io.BytesIO(response.content)).convert('RGB'),
                                  (140, 140))
          mask = Image.new('L', (140, 140), 0)
          ImageDraw.Draw(mask).rounded_rectangle((0, 0, 139, 139), radius=18, fill=255)
          profile.paste(portrait, (796, 15), mask)
          buffer = io.BytesIO()
          profile.save(buffer, 'PNG')
          image = buffer.getvalue()
          components.insert(0, {'type': 12, 'items': [{
              'media': {'url': 'attachment://abyss_preview.png'},
              'description': '상단 가로형 프로필 이미지 카드'
          }]})
          # Order the footer as: original YouTube banner, then four link buttons.
          link_row = components.pop(next(i for i, item in enumerate(components)
                                         if item.get('type') == 1 and
                                         any(b.get('label') == 'YouTube' for b in item.get('components', []))))
          components.append(original_banner)
          components.append(link_row)
          assert components[0]['type'] == 12
          assert components[-2]['type'] == 12, 'Bottom YouTube banner missing'
          assert components[-1]['type'] == 1, 'Official links must be below banner'
          assert len(components[-1]['components']) == 4, 'Exactly four links required'
          assert len(components) <= 10, 'V2 component budget exceeded'
          payload['allowed_mentions'] = {'parse': []}
          webhook = os.getenv('TEST_DISCORD_WEBHOOK_URL') or os.getenv('DISCORD_WEBHOOK_URL', '')
          if not webhook:
              raise RuntimeError('No configured Discord webhook')
          send_preview(webhook, payload, image)
          print('Rendered slim PNG header + bottom YouTube banner sent to fixed thread.')
          PY
          REMOTE
