          from pathlib import Path
          root=Path('/home/ubuntu/chzzk-bot/creator_media')
          index=json.loads((root/'index.json').read_text())
          for group in ('hanayo','sakihane'):
              for kind,needed in (('profile',3),('banner',2)):
                  entries=index[group][kind]
                  assert len(entries)>=needed and all((root/i['path']).is_file() for i in entries),f'Incomplete pool {group}/{kind}'
          PY
          SERVICE=chzzk-bot.service
          if ! systemctl is-active --quiet "$SERVICE"; then
             echo 'Production chzzk-bot.service is not active; aborting deployment'
             exit 1
          fi
          BACKUP="backups/random-media-$(date +%Y%m%d-%H%M%S)"
          mkdir -p "$BACKUP"
          for f in random_media.py discord_v2.py resilience.py; do
             if [ -f "$f" ]; then cp "$f" "$BACKUP/$f"; fi
          done
          cp -f /tmp/abyss_deploy_random_media.py random_media.py
          cp -f /tmp/abyss_deploy_discord_v2.py discord_v2.py
          cp -f /tmp/abyss_deploy_resilience.py resilience.py
          "$PY" -m py_compile random_media.py discord_v2.py resilience.py
          touch .env
          "$PY" - <<'PY'
          from pathlib import Path
          path=Path('.env')
          current=path.read_text()
          rows=[line for line in current.splitlines() if not line.strip().startswith('ABYSS_RANDOM_MEDIA=')]
          rows.append('ABYSS_RANDOM_MEDIA=1')
          path.write_text('\n'.join(rows)+'\n')
