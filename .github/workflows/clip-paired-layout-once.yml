name: Apply neatly spaced clip-grid titles once

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: read

concurrency:
  group: abyss-clip-layout-manual
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ github.repository == '114130lena/abyss-bot' && github.event.issue.title == '[abyss-clip] apply-clean-grid-titles-once' && github.event.issue.user.login == github.repository_owner }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Connect to production host
        env:
          SSH_HOST: ${{ secrets.ORACLE_HOST }}
          SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_HOST" && test -n "$SSH_KEY"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Apply the compact grid to the existing message without retiming
        env:
          SSH_HOST: ${{ secrets.ORACLE_HOST }}
          SSH_USER: ${{ secrets.ORACLE_USER }}
          REFRESH_REQUEST: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          test -n "$SSH_HOST" && test -n "$SSH_USER"
          test "$REFRESH_REQUEST" -ge 1
          # Publish the reviewed main-branch renderer directly from checkout;
          # the normal deployment queue may still be processing older commits.
          # This stage is temporary and does not overwrite the running bot.
          grep -q CLIP_GRID_CLEAN_TITLES_V3 chzzk_clip_digest.py
          scp -i ~/.ssh/oracle_key -o IdentitiesOnly=yes chzzk_clip_digest.py "$SSH_USER@$SSH_HOST:/tmp/abyss_clean_grid_once_$REFRESH_REQUEST.py"
          ssh -i ~/.ssh/oracle_key -o IdentitiesOnly=yes "$SSH_USER@$SSH_HOST" "REFRESH_REQUEST=$REFRESH_REQUEST bash -se" <<'REMOTE'
          set -euo pipefail
          cd /home/ubuntu/chzzk-bot
          test -f .env
          test -f "/tmp/abyss_clean_grid_once_${REFRESH_REQUEST}.py"
          grep -q CLIP_GRID_CLEAN_TITLES_V3 "/tmp/abyss_clean_grid_once_${REFRESH_REQUEST}.py"
          if [ -x .venv/bin/python ]; then PY=.venv/bin/python; else PY=.venv-test/bin/python; fi
          /usr/bin/flock -w 90 creator_media/clip_clean_grid.lock "$PY" - <<'PY'
          import json
          import os
          from dotenv import load_dotenv
          load_dotenv("/home/ubuntu/chzzk-bot/.env")
          import importlib.util
          from pathlib import Path
          from resilience import load_json, save_json
          # Import exactly the paired renderer staged from the latest main.
          source = Path("/tmp/abyss_clean_grid_once_" +
                        os.environ["REFRESH_REQUEST"] + ".py")
          spec = importlib.util.spec_from_file_location("grid_clip_digest", source)
          if spec is None or spec.loader is None:
              raise SystemExit("Clip renderer not found")
          paired = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(paired)
          STATE_FILE, publish_once = paired.STATE_FILE, paired.publish_once

          request_id = os.environ.get("REFRESH_REQUEST", "")
          if not request_id.isdigit():
              raise SystemExit("Invalid layout request")
          before = load_json(STATE_FILE, {})
          if not isinstance(before, dict):
              before = {}
          if request_id in (before.get("clean_grid_request_ids") or []):
              print("CLIP_CLEAN_GRID_ONCE " + json.dumps({"status": "already_updated"}))
              raise SystemExit(0)

          # User requested one compact grid layout on the existing message.
          # Scheduled 08:00/18:00 KST posts and representative history remain.
          result = publish_once()
          status = str(result.get("status") or "unknown")
          if status != "updated":
              print("CLIP_CLEAN_GRID_ONCE " + json.dumps({"status": status}))
              raise SystemExit(1)

          after = load_json(STATE_FILE, {})
          if not isinstance(after, dict):
              raise SystemExit("Invalid state after Discord update")
          if "last_published_slot" in before:
              after["last_published_slot"] = before["last_published_slot"]
          else:
              after.pop("last_published_slot", None)
          if "history" in before:
              after["history"] = before["history"]
          else:
              after.pop("history", None)
          if "latest_id" in before:
              after["latest_id"] = before["latest_id"]
          else:
              after.pop("latest_id", None)
          request_ids = list(dict.fromkeys(
              str(x) for x in (after.get("clean_grid_request_ids") or [])
              if str(x).isdigit()))
          if request_id not in request_ids:
              request_ids.append(request_id)
          # The marker is committed only after the live message passes
          # independent read-back verification.
          # Independently GET the original message; verify ONE media gallery
          # with numbered alt descriptions plus a compact clickable title list.
          import re
          import requests
          channel = os.getenv("CHZZK_CLIP_CHANNEL_ID", "")
          message = os.getenv("CHZZK_CLIP_MESSAGE_ID", "")
          token = os.getenv("DISCORD_BOT_TOKEN", "")
          response = requests.get(
              f"https://discord.com/api/v10/channels/{channel}/messages/{message}",
              headers={"Authorization": "Bot " + token}, timeout=12)
          response.raise_for_status()
          posted = response.json()
          if str(posted.get("id")) != message or not (int(posted.get("flags") or 0) & 32768):
              raise SystemExit("Original Discord clip message not verified")
          containers = posted.get("components") or []
          if len(containers) != 1 or containers[0].get("type") != 17:
              raise SystemExit("Clip grid must use one compact V2 container")
          children = containers[0].get("components") or []
          galleries = [p for p in children if p.get("type") == 12]
          if len(galleries) != 1 or len(galleries[0].get("items") or []) > 10:
              raise SystemExit("Expected one compact 10-item media grid")
          titles = [str(p.get("content") or "") for p in children
                    if p.get("type") == 10 and "클립 제목 · 갤러리 순서" in
                       str(p.get("content") or "")]
          if len(titles) != 1:
              raise SystemExit("Clip grid title legend missing")
          if "  ·  " in titles[0]:
              raise SystemExit("Old two-titles-per-row format remains")
          if len(titles[0].split("\n\n")) != 2:
              raise SystemExit("Title list must have two five-link groups")
          expected = min(int(result.get("count") or 0), 10)
          for index in range(1, expected + 1):
              if ("**%02d** [" % index) not in titles[0]:
                  raise SystemExit("Missing ordered clip-title link")
          media = galleries[0]["items"]
          if media and not all(
              len(str(item.get("description") or "")) >= 4 and
              str(item.get("description") or "")[:2].isdigit() and
              str(item.get("description") or "")[2:4] == ". "
              for item in media):
              raise SystemExit("Grid alt text lacks original clip numbers")
          if len(children) > 10 or len(media) > expected:
              raise SystemExit("Discord clip grid exceeds component limits")
          after["clean_grid_request_ids"] = request_ids[-20:]
          save_json(STATE_FILE, after)
          print("CLIP_CLEAN_GRID_ONCE " + json.dumps({
              "status": "updated", "clip_count": expected,
              "media_count": len(media), "original_message": True,
              "single_grid": True, "title_links": expected,
              "schedule_preserved": True, "history_preserved": True
          }))
          PY
          REMOTE
