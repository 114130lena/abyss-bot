name: Install daily 18:00 KST Hiyori CHZZK clip posting timer
on:
  push:
    branches: [feature/chzzk-clips-platform-probe]
    paths: [.github/workflows/install-hiyori-daily-1800.yml]
permissions:
  contents: read
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/chzzk-clips-platform-probe
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests python-dotenv
      - name: Test schedule, duplicate guard and clean video-only card
        run: |
          python -m py_compile hiyori_chzzk_daily_publisher.py scripts/test_hiyori_chzzk_daily_card.py scripts/chzzk_clip_video.py chzzk_hiyoriclip_collector.py
          PYTHONPATH=scripts:. python -m unittest -v test_hiyori_chzzk_daily_publisher.py test_chzzk_hiyoriclip_collector.py
      - name: Prepare SSH to Oracle
        env:
          HOST: ${{ secrets.ORACLE_HOST }}
          KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$KEY"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
      - name: Install production publisher, separate from all existing alert services
        env:
          HOST: ${{ secrets.ORACLE_HOST }}
          USER: ${{ secrets.ORACLE_USER }}
        run: |
          set -euo pipefail
          remote="$USER@$HOST"
          scp -i ~/.ssh/oracle_key -o IdentitiesOnly=yes hiyori_chzzk_daily_publisher.py "$remote:/tmp/abyss_hiyori_chzzk_daily_publisher.py"
          scp -i ~/.ssh/oracle_key -o IdentitiesOnly=yes scripts/test_hiyori_chzzk_daily_card.py "$remote:/tmp/abyss_hiyori_daily_card_module.py"
          scp -i ~/.ssh/oracle_key -o IdentitiesOnly=yes scripts/chzzk_clip_video.py "$remote:/tmp/abyss_chzzk_clip_video_module.py"
          ssh -i ~/.ssh/oracle_key -o IdentitiesOnly=yes "$remote" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /home/ubuntu/chzzk-bot
          if [ -x .venv/bin/python ]; then PY=/home/ubuntu/chzzk-bot/.venv/bin/python
          elif [ -x .venv-test/bin/python ]; then PY=/home/ubuntu/chzzk-bot/.venv-test/bin/python
          else echo "Missing Python virtual environment" >&2; exit 1; fi
          "$PY" -m py_compile /tmp/abyss_hiyori_chzzk_daily_publisher.py /tmp/abyss_hiyori_daily_card_module.py /tmp/abyss_chzzk_clip_video_module.py
          "$PY" -c 'import dotenv,requests'
          test -s chzzk_hiyoriclip_collector.py
          mkdir -p creator_media
          install -m 644 /tmp/abyss_hiyori_chzzk_daily_publisher.py hiyori_chzzk_daily_publisher.py
          install -m 644 /tmp/abyss_hiyori_daily_card_module.py test_hiyori_chzzk_daily_card.py
          install -m 644 /tmp/abyss_chzzk_clip_video_module.py chzzk_clip_video.py
          # Production webhook credentials already reside in .env; do not expose them.
          test -s .env
          cat >/tmp/abyss-hiyori-daily-clip.service <<EOF
          [Unit]
          Description=Post one top-viewed Hiyori CHZZK clip daily at 18:00 Korea time
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=oneshot
          User=ubuntu
          Group=ubuntu
          WorkingDirectory=/home/ubuntu/chzzk-bot
          ExecStart=/usr/bin/flock -w 180 /home/ubuntu/chzzk-bot/creator_media/chzzk_hiyoriclip.lock $PY /home/ubuntu/chzzk-bot/hiyori_chzzk_daily_publisher.py
          TimeoutStartSec=330
          NoNewPrivileges=true
          EOF
          cat >/tmp/abyss-hiyori-daily-clip.timer <<'EOF'
          [Unit]
          Description=Daily 18:00 KST Hiyori CHZZK clip recommendation

          [Timer]
          OnCalendar=*-*-* 18:00:00 Asia/Seoul
          AccuracySec=1s
          RandomizedDelaySec=0
          Persistent=false
          Unit=abyss-hiyori-daily-clip.service

          [Install]
          WantedBy=timers.target
          EOF
          sudo install -m 644 /tmp/abyss-hiyori-daily-clip.service /etc/systemd/system/abyss-hiyori-daily-clip.service
          sudo install -m 644 /tmp/abyss-hiyori-daily-clip.timer /etc/systemd/system/abyss-hiyori-daily-clip.timer
          sudo systemctl daemon-reload
          sudo systemctl enable --now abyss-hiyori-daily-clip.timer
          sudo systemctl is-active abyss-hiyori-daily-clip.timer
          systemd-analyze calendar '*-*-* 18:00:00 Asia/Seoul'
          systemctl list-timers --all abyss-hiyori-daily-clip.timer --no-pager
          "$PY" hiyori_chzzk_daily_publisher.py --show
          echo HIYORI_DAILY_1800_TIMER_INSTALLED
          REMOTE
