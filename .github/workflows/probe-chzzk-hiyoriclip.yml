name: Probe CHZZK Hiyori clip data read-only
on:
  push:
    branches: [feature/chzzk-clips-platform-probe]
    paths: [.github/workflows/probe-chzzk-hiyoriclip.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/chzzk-clips-platform-probe
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - run: python -u scripts/probe_chzzk_hiyori_clips.py
