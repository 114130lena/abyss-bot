name: Preview image card in Discord test thread
on:
  workflow_dispatch:
    inputs:
      streamer:
        description: Streamer for the mock notification
        required: true
        type: choice
        options:
          - hanayo
          - sakihane
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image-preview dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate preview message without sending
        run: python test_image_card.py --group "${{ inputs.streamer }}"
      - name: Post preview through existing server webhook into fixed test thread
        env:
          SSH_HOST: ${{ secrets.ORACLE_HOST }}
          SSH_USER: ${{ secrets.ORACLE_USER }}
          SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          STREAMER: ${{ inputs.streamer }}
        run: |
          set -eu
          test -n "$SSH_HOST" && test -n "$SSH_USER" && test -n "$SSH_KEY"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/oracle_key -o IdentitiesOnly=yes "$SSH_USER@$SSH_HOST" \
            "cd /home/ubuntu/chzzk-bot && if [ -x .venv/bin/python ]; then PY=.venv/bin/python; else PY=.venv-test/bin/python; fi; \"\$PY\" test_image_card.py --group $STREAMER --send --use-existing-webhook"
