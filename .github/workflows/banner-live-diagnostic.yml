name: Read-only production 18h banner diagnosis

on:
  pull_request:
    paths:
      - '.github/workflows/banner-live-diagnostic.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Prepare production read-only access
        env:
          SSH_HOST: ${{ secrets.ORACLE_HOST }}
          SSH_USER: ${{ secrets.ORACLE_USER }}
          SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_HOST" && test -n "$SSH_USER" && test -n "$SSH_KEY"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/banner_diag
          chmod 600 ~/.ssh/banner_diag
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          timeout 35s ssh -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -o ConnectTimeout=12 -i ~/.ssh/banner_diag -o IdentitiesOnly=yes "$SSH_USER@$SSH_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /home/ubuntu/chzzk-bot
          echo "=== Services ==="
          systemctl is-active chzzk-bot.service || true
          systemctl is-active abyss-guild-banner.timer || true
          systemctl is-active abyss-guild-banner.service || true
          echo "=== Recent banner journal (sanitized status only) ==="
          journalctl -u chzzk-bot.service --since '2026-11-09 17:55:00' --until '2026-11-09 18:30:00' --no-pager -o cat 2>/dev/null | grep -E 'SERVER_BANNER_ROTATION_(EXHAUSTED|SKIPPED)|SERVER_BANNER_PIPELINE|server-banner result:|SERVER_BANNER_OUTSIDE_WRITE_WINDOW|서버 배너 자동 변경 실패' | sed -E 's/(artist|source|post_url)=[^ ,}]+/\1=[REDACTED]/g' | tail -35 || true
          echo "=== Candidate inventory and canonical slot ==="
          if [ -x .venv/bin/python ]; then PY=.venv/bin/python; else PY=.venv-test/bin/python; fi
          "$PY" - <<'PY'
          import os
          from pathlib import Path
          from dotenv import load_dotenv
          load_dotenv(Path('/home/ubuntu/chzzk-bot/.env'))
          import json
          from datetime import datetime
          from zoneinfo import ZoneInfo
          path=Path('creator_media/guild_banner_rotation_state.json')
          try:
              s=json.loads(path.read_text(encoding='utf-8'))
          except (OSError,ValueError):
              s={}
          print('BANNER_STATE last_slot=%s candidate_total=%s remaining_after=%s changed_at=%s enabled=%s' % (
              s.get('last_slot'),s.get('candidate_total'),s.get('remaining_after'),
              s.get('banner_changed_at'),os.getenv('SERVER_BANNER_ENABLED','0')))
          print('BANNER_STATE rotated_used_count=%s used_post_count=%s last_hash_known=%s' % (
              len(s.get('rotation_used') or []),len(s.get('all_used_post_ids') or []),
              bool(s.get('guild_banner_hash'))))
          print('BANNER_STATE now_kst=%s' % datetime.now(ZoneInfo('Asia/Seoul')).strftime('%Y-%m-%d %H:%M'))
          PY
          REMOTE
