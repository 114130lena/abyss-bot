name: Verify safe Hiyoriclip collection without Discord publishing
on:
  push:
    branches: [feature/hiyoriclip-daily-recommendation]
    paths: [.github/workflows/verify-hiyoriclip-collector.yml]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/hiyoriclip-daily-recommendation
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - name: Validate collector, RSS parsing, deduplication and score model
        run: |
          python -m py_compile hiyoriclip_collector.py daily_hiyoriclip_selector.py
          python -m unittest -v test_hiyoriclip_collector.py test_daily_hiyoriclip_selector.py
