name: Deploy X video and official-banner routing
on:
  issues:
    types: [opened]
permissions:
  contents: read
  issues: read
jobs:
  deploy:
    if: false # Retired one-off deployment; only deploy.yml may update live code
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/compact-footer-four-links
          persist-credentials: false
      - name: Compile and simulate media cases
        run: |
          python -m py_compile x_post_media.py twitter_notifier.py twitter_huya_notifier.py x_repost_notifier.py resilience.py
          python - <<'PY'
          import unittest.mock as m
          import x_post_media
          class Fake:
              def raise_for_status(self):pass
              def json(self):return {'tweet':{'media':{'photos':[],'videos':[{'thumbnail_url':'https://pbs.twimg.com/media/example.jpg'}]}}}
          with m.patch.object(x_post_media.requests,'get',return_value=Fake()):
              photos,poster,video,known=x_post_media.resolve_media({'id':'2117211562968797400'},'HanayoHiyori')
              assert not photos and poster.endswith('example.jpg') and video and known
          assert 'native_post_photo = photo_unknown or has_video' in open('resilience.py').read()
          assert 'if not native_post_photo and os.getenv("ABYSS_FANART_URLS"' in open('resilience.py').read()
          print('VIDEO_BANNER_UNIT_TEST_OK')
          PY
      - name: Deploy video detection to Oracle
        env:
          SSH_HOST: ${{ secrets.ORACLE_HOST }}
          SSH_USER: ${{ secrets.ORACLE_USER }}
          SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/video_key
          chmod 600 ~/.ssh/video_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          for f in x_post_media.py twitter_notifier.py twitter_huya_notifier.py x_repost_notifier.py resilience.py; do
            scp -i ~/.ssh/video_key -o IdentitiesOnly=yes "$f" "$SSH_USER@$SSH_HOST:/tmp/video_route_$f"
          done
          ssh -i ~/.ssh/video_key -o IdentitiesOnly=yes "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /home/ubuntu/chzzk-bot
          if [ -x .venv/bin/python ]; then PY=.venv/bin/python; else PY=.venv-test/bin/python; fi
          "$PY" -m py_compile /tmp/video_route_x_post_media.py /tmp/video_route_twitter_notifier.py /tmp/video_route_twitter_huya_notifier.py /tmp/video_route_x_repost_notifier.py /tmp/video_route_resilience.py
          "$PY" - <<'PY'
          import importlib.util
          spec=importlib.util.spec_from_file_location("video_route_staged","/tmp/video_route_x_post_media.py")
          mod=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          for user,post in [('HanayoHiyori','2117211562968797400'),('SakihaneHuya','2117264651247649266')]:
              photos,preview,video,known=mod.resolve_media({'id':post},user)
              print('LIVE_MEDIA_PROBE',user,post,'photos',len(photos),'video',video,'preview',bool(preview),'known',known,flush=True)
          PY
          BACKUP="backups/video-banner-$(date +%Y%m%d-%H%M%S)"
          mkdir -p "$BACKUP"
          for f in x_post_media.py twitter_notifier.py twitter_huya_notifier.py x_repost_notifier.py resilience.py; do
            cp "$f" "$BACKUP/$f"
            cp "/tmp/video_route_$f" "$f"
          done
          sudo systemctl restart chzzk-bot.service
          sudo systemctl is-active --quiet chzzk-bot.service
          echo X_VIDEO_BANNER_DEPLOY_SUCCESS
          REMOTE
