name: 통나무 파워 운영 통계
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
  push:
    branches: ['feature/log-power']
    paths: ['.github/workflows/log-power-stats.yml']
permissions:
  contents: write
concurrency:
  group: log-power-public-stats
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Retrieve aggregate only
        env:
          SSH_HOST: ${{ secrets.ORACLE_HOST }}
          SSH_USER: ${{ secrets.ORACLE_USER }}
          SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/key -o IdentitiesOnly=yes "$SSH_USER@$SSH_HOST" 'bash -s' > /tmp/lp-stats.json <<'REMOTE'
          set -eu
          cd /home/ubuntu/abyss-log-power
          .venv/bin/python - <<'PY'
          import json,subprocess
          from log_power.public_stats import snapshot
          d=snapshot("data/points.sqlite3")
          d["service_active"]=subprocess.run(["systemctl","is-active","--quiet","abyss-log-power"]).returncode==0
          print(json.dumps(d))
          PY
          REMOTE
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("/tmp/lp-stats.json").read_text())
          keys={"checked_at","users","balance","held","circulation","ledger_total","attendance_today","active_predictions","finished_predictions","ledger_consistent","db_integrity","backup_age_seconds","service_active"}
          assert set(d)==keys and all(v is None or type(v) in (int,bool) for v in d.values())
          Path("log-power-stats.json").write_text(json.dumps(d)+"\n")
          PY
      - name: Publish aggregate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add log-power-stats.json
          if ! git diff --cached --quiet; then
            git commit -m '통나무 파워 집계 갱신'
            git pull --rebase origin gh-pages
            git push origin HEAD:gh-pages
          fi
